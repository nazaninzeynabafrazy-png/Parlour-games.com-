  `;
  document.getElementById('unChangeSettings').addEventListener('click', () => unStartSetup());
  document.getElementById('unNew').addEventListener('click', () => { unHands = null; renderUno(); });
  if (unOver) document.getElementById('unNextRound').addEventListener('click', () => { unDealNewRound(); unRenderBoard(); if (unTurnIdx !== 0) setTimeout(unAiTurn, 700); });

  const oppWrap = document.getElementById('unOpponents');
  unNames.forEach((name, i) => {
    if (i === 0) return;
    const box = document.createElement('div');
    box.className = 'un-opp' + (unTurnIdx === i && !unOver ? ' active-turn' : '');
    box.innerHTML = `<div class="un-opp-name">${name}</div><div class="un-opp-count">${unHands[i].length} cards</div>${unHands[i].length === 1 ? '<div class="un-opp-uno">UNO!</div>' : ''}`;

  });

  const deckPile = document.getElementById('unDeckPile');
  const back = document.createElement('div');
  back.className = 'un-card back';
  back.textContent = unDeck.length;
  deckPile.appendChild(back);

  const topCard = unDiscard[unDiscard.length - 1];
  const discardSlot = document.getElementById('unDiscardSlot');
  const topEl = document.createElement('div');
  topEl.className = 'un-card ' + (topCard.value === 'Wild' || topCard.value === 'Wild4' ? 'wild' : topCard.color);
  topEl.style.whiteSpace = 'pre';
  topEl.textContent = unCardLabel(topCard);
  discardSlot.appendChild(topEl);
  if (topCard.value === 'Wild' || topCard.value === 'Wild4') {
    const dot = document.createElement('span');
    dot.className = 'un-color-dot';
    dot.style.background = ({red: '#c62828', yellow: '#f9a825', green: '#2e7d32', blue: '#1565c0'})[unCurrentColor];
    discardSlot.appendChild(dot);
  }

  document.getElementById('unStatus').textContent = unMsg || '';

  const handWrap = document.getElementById('unHand');
  const myTurn = !unOver && unTurnIdx === 0;
  const playable = myTurn ? unPlayableIndices(unHands[0]) : [];
  unHands[0].forEach((card, i) => {
    const el = document.createElement('div');
    const isPlayable = playable.includes(i);
    el.className = 'un-card ' + (card.value === 'Wild' || card.value === 'Wild4' ? 'wild' : card.color) + (myTurn && isPlayable ? ' playable' : (myTurn ? ' disabled' : ''));
    el.style.whiteSpace = 'pre';
    el.textContent = unCardLabel(card);
    if (myTurn) el.addEventListener('click', () => unHandleCardClick(i));
    handWrap.appendChild(el);
  });
  if (myTurn && !playable.length) {
    const drawEl = document.createElement('div');
    drawEl.className = 'un-card back';
    drawEl.textContent = 'Draw';
    drawEl.style.cursor = 'pointer';
    drawEl.addEventListener('click', unHandleDraw);

  unNames.forEach((name, i) => {

    chip.className = 'un-score-chip';
    chip.textContent = `${name}: ${unScores[i]}`;

  });
}

function unHandleCardClick(i) {
  if (unOver || unTurnIdx !== 0) return;
  const card = unHands[0][i];
  const playable = unPlayableIndices(unHands[0]);
  if (!playable.includes(i)) return;
  if (card.value === 'Wild' || card.value === 'Wild4') {
    unPendingWildIdx = i;
    unShowColorPicker();
    return;
  }
  unPlayCard(0, i, null);
}

function unShowColorPicker() {
  const wrap = document.getElementById('unColorPicker');
  wrap.innerHTML = '<div class="un-colorpicker" id="unColorPickerRow"></div>';
  const row = document.getElementById('unColorPickerRow');

  UN_COLORS.forEach(color => {
    const b = document.createElement('div');
    b.className = 'un-color-btn';
    b.style.background = hex[color];
    b.addEventListener('click', () => {
      const idx = unPendingWildIdx;
      unPendingWildIdx = null;
      document.getElementById('unColorPicker').innerHTML = '';
      unPlayCard(0, idx, color);
    });
    row.appendChild(b);
  });
}

function unHandleDraw() {
  if (unOver || unTurnIdx !== 0) return;
  if (unPlayableIndices(unHands[0]).length) return;
  unDrawCards(0, 1);
  unMsg = 'You drew a card.';
  unAdvanceTurn(1);
  unAfterTurn();
}

  {text: 'You win a town poetry contest. Collect $50.', effect: {type: 'collect', amount: 50}},
  {text: 'Advance to GO. Collect $200.', effect: {type: 'moveTo', pos: 0, passGo: false}},
  {text: 'Advance to Skyline Tower.', effect: {type: 'moveTo', pos: 39, passGo: true}},
  {text: 'Advance to the nearest Station. Pay double rent if owned.', effect: {type: 'nearestRailroad', multiplier: 2}},
  {text: 'Advance to the nearest Station. Pay double rent if owned.', effect: {type: 'nearestRailroad', multiplier: 2}},
  {text: 'Go directly to Jail. Do not pass GO.', effect: {type: 'goToJail'}},
  {text: 'Your investments mature. Collect $150.', effect: {type: 'collect', amount: 150}},
  {text: 'Pay school fees of $50.', effect: {type: 'pay', amount: 50}},
  {text: 'Get out of jail free. Keep this card until needed.', effect: {type: 'getOutOfJail'}},
  {text: 'Go back 3 spaces.', effect: {type: 'moveBy', steps: -3}},
  {text: 'You are elected town official. Pay each player $25.', effect: {type: 'payEach', amount: 25}},
  {text: 'Your building loan matures. Collect $100.', effect: {type: 'collect', amount: 100}},
  {text: 'Advance to the nearest Utility. Pay 10x the dice roll if owned.', effect: {type: 'nearestUtility'}},
];
const MP_COMMUNITY = [
  {text: 'Bank error in your favor. Collect $75.', effect: {type: 'collect', amount: 75}},
  {text: 'Doctor\'s fee. Pay $50.', effect: {type: 'pay', amount: 50}},
  {text: 'You inherit $100.', effect: {type: 'collect', amount: 100}},
  {text: 'You sell some stock. Collect $45.', effect: {type: 'collect', amount: 45}},
  {text: 'Go to Jail. Do not pass GO, do not collect $200.', effect: {type: 'goToJail'}},
  {text: 'Holiday fund matures. Collect $100.', effect: {type: 'collect', amount: 100}},
  {text: 'Income tax refund. Collect $20.', effect: {type: 'collect', amount: 20}},
  {text: 'Pay hospital fees of $100.', effect: {type: 'pay', amount: 100}},
  {text: 'You win second prize in a bake-off. Collect $10.', effect: {type: 'collect', amount: 10}},
  {text: 'Get out of jail free. Keep this card until needed.', effect: {type: 'getOutOfJail'}},
  {text: 'Pay for repairs: $40 per house, $115 per hotel.', effect: {type: 'repairs', perHouse: 40, perHotel: 115}},
  {text: 'It is your birthday. Collect $10 from every player.', effect: {type: 'collectEach', amount: 10}},
  {text: 'Advance to GO. Collect $200.', effect: {type: 'moveTo', pos: 0, passGo: false}},
  {text: 'School fees. Pay $50.', effect: {type: 'pay', amount: 50}},
];

function mpRentTable(price) {
  const base = Math.max(2, Math.round(price * 0.08 / 2) * 2);
  return {
    base,
    withSet: base * 2,
    houses: [base * 5, base * 15, base * 45, base * 80],
    hotel: base * 110,
    housePrice: Math.round(price / 2 / 10) * 10,
    mortgage: Math.round(price / 2 / 10) * 10,
  };
}

function mpGroupIndices(group) {
  const out = [];
  MP_BOARD.forEach((s, i) => { if (s.type === 'property' && s.group === group) out.push(i); });
  return out;
}

function mpOwnsFullGroup(playerIdx, group) {
  return mpGroupIndices(group).every(i => mpProperties[i] && mpProperties[i].owner === playerIdx);
}

function mpComputeRent(spaceIdx, roll) {
  const space = MP_BOARD[spaceIdx];
  const prop = mpProperties[spaceIdx];
  if (!prop || prop.mortgaged) return 0;
  if (space.type === 'railroad') {
    const count = MP_BOARD.reduce((n, s, i) => (s.type === 'railroad' && mpProperties[i] && mpProperties[i].owner === prop.owner && !mpProperties[i].mortgaged) ? n + 1 : n, 0);
    return [0, 25, 50, 100, 200][count];
  }
  if (space.type === 'utility') {
    const count = MP_BOARD.reduce((n, s, i) => (s.type === 'utility' && mpProperties[i] && mpProperties[i].owner === prop.owner && !mpProperties[i].mortgaged) ? n + 1 : n, 0);
    return (roll || 7) * (count >= 2 ? 10 : 4);
  }
  const rt = mpRentTable(space.price);
  if (prop.houses === 5) return rt.hotel;
  if (prop.houses > 0) return rt.houses[prop.houses - 1];
  return mpOwnsFullGroup(prop.owner, space.group) ? rt.withSet : rt.base;
}

function mpStartGame(variant, aiCount) {
  mpVariant = variant;
  mpPlayerCount = aiCount + 1;
  mpNames = ['You'].concat(['Ada', 'Bo', 'Cy'].slice(0, aiCount));
  mpPositions = mpNames.map(() => 0);
  mpCash = mpNames.map(() => 1500);
  mpProperties = {};
  mpInJail = mpNames.map(() => false);
  mpJailTurns = mpNames.map(() => 0);
  mpGetOutCards = mpNames.map(() => 0);
  mpBankrupt = mpNames.map(() => false);
  mpBankruptOrder = [];
  mpTurnIdx = 0;
  mpDoublesCount = 0;
  mpDice = [1, 1];
  mpOver = false;
  startTimer();
  mpWinnerIdx = null;
  mpPendingAction = 'roll';
  mpPendingSpace = null;
  mpCardPopup = null;
  mpMsg = `${mpNames[0]}, roll to begin.`;
  mpDecks = {fortune: unShuffle(MP_FORTUNE.slice()), community: unShuffle(MP_COMMUNITY.slice())};
}

function mpActivePlayers() { return mpNames.map((n, i) => i).filter(i => !mpBankrupt[i]); }

function mpMovePlayer(idx, steps) {
  const from = mpPositions[idx];
  let to = (from + steps + 40) % 40;
  if (steps > 0 && to < from) { mpCash[idx] += 200; mpMsg = `${mpNames[idx]} passed GO and collected $200.`; }
  mpPositions[idx] = to;
  return to;
}

function mpSendToJail(idx) {
  mpPositions[idx] = 10;
  mpInJail[idx] = true;
  mpJailTurns[idx] = 0;
  mpMsg = `${mpNames[idx]} was sent to jail.`;
}

function mpDeckDraw(deckName) {
  const deck = mpDecks[deckName];
  const card = deck.shift();
  deck.push(card);
  return card;
}

function mpApplyCardEffect(idx, card) {
  const e = card.effect;
  if (e.type === 'collect') mpCash[idx] += e.amount;
  else if (e.type === 'pay') mpPayBank(idx, e.amount);
  else if (e.type === 'moveTo') { const before = mpPositions[idx]; mpPositions[idx] = e.pos; if (e.passGo && e.pos < before) mpCash[idx] += 200; mpResolveSpace(idx, true); return; }
  else if (e.type === 'moveBy') { mpMovePlayer(idx, e.steps); mpResolveSpace(idx, true); return; }
  else if (e.type === 'goToJail') { mpSendToJail(idx); return; }
  else if (e.type === 'getOutOfJail') mpGetOutCards[idx]++;
  else if (e.type === 'payEach') mpActivePlayers().forEach(p => { if (p !== idx) { mpPayBank(idx, e.amount); mpCash[p] += e.amount; } });
  else if (e.type === 'collectEach') mpActivePlayers().forEach(p => { if (p !== idx) { mpCash[p] -= e.amount; mpCash[idx] += e.amount; } });
  else if (e.type === 'repairs') {
    let total = 0;
    Object.keys(mpProperties).forEach(k => { const p = mpProperties[k]; if (p.owner === idx) { if (p.houses === 5) total += e.perHotel; else total += p.houses * e.perHouse; } });
    mpPayBank(idx, total);
  } else if (e.type === 'nearestRailroad' || e.type === 'nearestUtility') {
    const wantType = e.type === 'nearestRailroad' ? 'railroad' : 'utility';
    let pos = mpPositions[idx];
    let steps = 0;
    do { pos = (pos + 1) % 40; steps++; } while (MP_BOARD[pos].type !== wantType && steps < 40);
    const before = mpPositions[idx];
    mpPositions[idx] = pos;
    if (pos < before) mpCash[idx] += 200;
    mpResolveSpace(idx, true, e.multiplier || null);
    return;
  }
  mpPendingAction = 'manage';
}

function mpPayBank(idx, amount) {
  mpCash[idx] -= amount;
  mpCheckBankruptcy(idx);
}

function mpPayPlayer(fromIdx, toIdx, amount) {
  mpCash[fromIdx] -= amount;
  mpCash[toIdx] += amount;
  mpCheckBankruptcy(fromIdx);
}

function mpCheckBankruptcy(idx) {
  if (mpCash[idx] < 0 && !mpBankrupt[idx]) {
    mpBankrupt[idx] = true;
    mpBankruptOrder.push(idx);
    Object.keys(mpProperties).forEach(k => { if (mpProperties[k].owner === idx) delete mpProperties[k]; });
    mpMsg = `${mpNames[idx]} went bankrupt!`;
    const remaining = mpActivePlayers();
    if (remaining.length === 1) {
      mpOver = true;
      pauseTimer();
      mpWinnerIdx = remaining[0];
      mpMsg = `${mpNames[remaining[0]]} wins the game!`;
      const stats = safeGet('mp-stats', { wins: 0, losses: 0 });
      if (mpWinnerIdx === 0) stats.wins = (stats.wins || 0) + 1;
      else stats.losses = (stats.losses || 0) + 1;
      safeSet('mp-stats', stats);
      // 1st = last one standing, then whoever went bankrupt last, and so on.
      const podiumEntries = [{ name: mpNames[mpWinnerIdx], you: mpWinnerIdx === 0, detail: '$' + mpCash[mpWinnerIdx] + ' left' }]
        .concat(mpBankruptOrder.slice().reverse().map(i => ({ name: mpNames[i], you: i === 0, detail: 'Went bankrupt' })));
      setTimeout(() => showPodium({ game: 'Monopoly', entries: podiumEntries }), 900);
    }
  }
}

function mpAuction(spaceIdx) {
  const space = MP_BOARD[spaceIdx];
  const bidders = mpActivePlayers();
  let bestIdx = null, bestBid = 0;
  bidders.forEach(i => {
    const maxBid = Math.max(0, Math.round((mpCash[i] - 150) * (0.3 + Math.random() * 0.3)));
    const bid = Math.min(maxBid, space.price * 2);
    if (bid > bestBid) { bestBid = bid; bestIdx = i; }
  });
  if (bestIdx !== null && bestBid > 0) {
    mpCash[bestIdx] -= bestBid;
    mpProperties[spaceIdx] = {owner: bestIdx, houses: 0, mortgaged: false};
    mpMsg = `${space.name} went to auction — ${mpNames[bestIdx]} won it for $${bestBid}.`;
    mpCheckBankruptcy(bestIdx);
  } else {
    mpMsg = `${space.name} went to auction but nobody bid.`;
  }
}

function mpResolveSpace(idx, fromCard, rentMultiplier) {
  const pos = mpPositions[idx];
  const space = MP_BOARD[pos];
  if (space.type === 'property' || space.type === 'railroad' || space.type === 'utility') {
    const prop = mpProperties[pos];
    if (!prop) {
      if (idx === 0) { mpPendingAction = 'buy'; mpPendingSpace = pos; mpMsg = `Buy ${space.name} for $${space.price}?`; return; }
      const buy = mpAiDecideBuy(idx, pos);
      if (buy) {
        mpCash[idx] -= space.price;
        mpProperties[pos] = {owner: idx, houses: 0, mortgaged: false};
        mpMsg = `${mpNames[idx]} bought ${space.name} for $${space.price}.`;
      } else if (mpVariant === 'classic') {
        mpAuction(pos);
      } else {
        mpMsg = `${mpNames[idx]} passed on ${space.name}.`;
      }
      mpPendingAction = 'manage';
    } else if (prop.owner !== idx && !prop.mortgaged) {
      const rent = mpComputeRent(pos, mpDice[0] + mpDice[1]) * (rentMultiplier || 1);
      mpPayPlayer(idx, prop.owner, rent);
      mpMsg = `${mpNames[idx]} paid $${rent} rent to ${mpNames[prop.owner]} for ${space.name}.`;
      mpPendingAction = 'manage';
    } else {
      mpPendingAction = 'manage';
    }
  } else if (space.type === 'tax') {
    mpPayBank(idx, space.amount);
    mpMsg = `${mpNames[idx]} paid $${space.amount} in tax.`;
    mpPendingAction = 'manage';
  } else if (space.type === 'card') {
    const card = mpDeckDraw(space.deck);
    mpCardPopup = card.text;
    mpMsg = `${mpNames[idx]} drew: ${card.text}`;
    mpApplyCardEffect(idx, card);
    return;
  } else if (space.type === 'gotojail') {
    mpSendToJail(idx);
    mpPendingAction = 'manage';
  } else {
    mpPendingAction = 'manage';
  }
}

function mpAiDecideBuy(idx, spaceIdx) {
  const space = MP_BOARD[spaceIdx];
  const reserve = mpVariant === 'classic' ? 150 : 100;
  return mpCash[idx] - space.price >= reserve;
}

function mpAiMaybeBuild(idx) {
  if (mpVariant !== 'classic') return;
  const groups = Object.keys(MP_GROUP_COLOR);
  groups.forEach(g => {
    if (!mpOwnsFullGroup(idx, g)) return;
    const indices = mpGroupIndices(g);
    let guard = 0;
    while (guard < 10) {
      guard++;
      const minHouses = Math.min(...indices.map(i => mpProperties[i].houses));
      const target = indices.find(i => mpProperties[i].houses === minHouses && mpProperties[i].houses < 5);
      if (target === undefined) break;
      const rt = mpRentTable(MP_BOARD[target].price);
      if (mpCash[idx] - rt.housePrice < 200) break;
      mpCash[idx] -= rt.housePrice;
      mpProperties[target].houses++;
    }
  });
}

function mpAiHandleJail(idx) {
  if (mpGetOutCards[idx] > 0) { mpGetOutCards[idx]--; mpInJail[idx] = false; mpJailTurns[idx] = 0; mpMsg = `${mpNames[idx]} used a Get Out of Jail Free card.`; mpBeginRoll(idx); return; }
  const d = [1 + Math.floor(Math.random() * 6), 1 + Math.floor(Math.random() * 6)];
  mpDice = d;
  if (d[0] === d[1]) { mpInJail[idx] = false; mpJailTurns[idx] = 0; mpMsg = `${mpNames[idx]} rolled doubles and left jail.`; mpMovePlayer(idx, d[0] + d[1]); mpResolveSpace(idx); mpAfterRoll(idx, true); return; }
  mpJailTurns[idx]++;
  if (mpJailTurns[idx] >= 3 || mpCash[idx] >= 200) {
    mpPayBank(idx, 50);
    mpInJail[idx] = false; mpJailTurns[idx] = 0;
    mpMsg = `${mpNames[idx]} paid $50 bail.`;
    mpMovePlayer(idx, d[0] + d[1]);
    mpResolveSpace(idx);
    mpAfterRoll(idx, false);
    return;
  }
  mpMsg = `${mpNames[idx]} stays in jail.`;
  mpPendingAction = 'manage';
  mpEndTurn();
}

function mpBeginRoll(idx) {
  mpPendingAction = 'roll';
}

function mpAfterRoll(idx, doubles) {
  if (mpOver) return;
  if (doubles && mpVariant === 'classic') {
    mpDoublesCount++;
    if (mpDoublesCount >= 3) { mpSendToJail(idx); mpDoublesCount = 0; mpPendingAction = 'manage'; return; }
  } else {
    mpDoublesCount = 0;
  }
}

function mpRoll(idx) {
  const d = [1 + Math.floor(Math.random() * 6), 1 + Math.floor(Math.random() * 6)];
  mpDice = d;
  const doubles = d[0] === d[1];
  mpMovePlayer(idx, d[0] + d[1]);
  mpResolveSpace(idx);
  if (!mpOver) mpAfterRoll(idx, doubles);
}

function mpEndTurn() {
  if (mpOver) return;
  mpDoublesCount = 0;
  let next = mpTurnIdx;
  do { next = (next + 1) % mpPlayerCount; } while (mpBankrupt[next] && next !== mpTurnIdx);
  mpTurnIdx = next;
  if (mpTurnIdx === 0 && mpInJail[0]) {
    if (mpVariant === 'classic') {
      mpPendingAction = 'jailChoice';
      mpMsg = `${mpNames[0]}, you're in jail. Pay $50, use a card, or try for doubles.`;
      return;
    }
    // Quick mode: jail is a single skipped turn, then automatically free.
    if (mpJailTurns[0] >= 1) {
      mpInJail[0] = false;
      mpJailTurns[0] = 0;
      mpPendingAction = 'roll';
      mpMsg = `${mpNames[0]}, you're free from jail -- roll to continue.`;
    } else {
      mpJailTurns[0]++;
      mpMsg = `${mpNames[0]} is in jail and skips this turn.`;
      mpEndTurn();
      return;
    }
    return;
  }
  mpPendingAction = 'roll';
  mpMsg = `${mpNames[mpTurnIdx]}'s turn.`;
}

function mpAiTakeTurn() {
  if (mpOver) return;
  const idx = mpTurnIdx;
  if (mpBankrupt[idx]) { mpEndTurn(); mpAfterStateChange(); return; }
  if (mpInJail[idx]) {
    if (mpVariant === 'quick') {
      if (mpJailTurns[idx] >= 1) { mpInJail[idx] = false; mpJailTurns[idx] = 0; } else { mpJailTurns[idx]++; mpMsg = `${mpNames[idx]} is in jail and skips this turn.`; mpEndTurn(); mpAfterStateChange(); return; }
    } else {
      mpAiHandleJail(idx);
      mpAiMaybeBuild(idx);
      mpAfterStateChange();
      return;
    }
  }
  let doublesInRow = 0;
  let keepRolling = true;
  while (keepRolling && !mpOver && !mpBankrupt[idx]) {
    const d = [1 + Math.floor(Math.random() * 6), 1 + Math.floor(Math.random() * 6)];
    mpDice = d;
    const doubles = d[0] === d[1];
    mpMovePlayer(idx, d[0] + d[1]);
    mpResolveSpace(idx);
    if (mpOver) break;
    if (doubles && mpVariant === 'classic') {
      doublesInRow++;
      if (doublesInRow >= 3) { mpSendToJail(idx); keepRolling = false; }
    } else keepRolling = false;
  }
  if (!mpOver) { mpAiMaybeBuild(idx); mpEndTurn(); }
  mpAfterStateChange();
}

function mpAfterStateChange() {
  mpRenderBoard();
  if (mpOver) return;
  if (mpTurnIdx !== 0) setTimeout(mpAiTakeTurn, 650);
}

function mpStartSetup() { mpShowSetup = true; renderMonopoly(); }

function mpRenderSetup() {
  view.innerHTML = `
    <h2 class="game-title">Monopoly</h2>
    <p class="game-sub">Pick a rule set and how many computer opponents you want.</p>
    ${aboutBlock(`
      <ul>
        <li><b>Classic</b> — full rules: auctions when a purchase is declined, mortgaging, the even-build rule for houses, and the full 3-option jail (pay $50, use a card, or try for doubles).</li>
        <li><b>Quick</b> — a faster, simplified game: no auctions (a declined property just stays unowned), no mortgaging, build houses freely on a monopoly, and jail is a single skipped turn.</li>
        <li>Neither mode includes trading between players — negotiating fair trades against computer opponents isn't implemented.</li>
        <li>Land on an unowned space to buy it; land on another player's property to pay rent; own every property in a color group to double the rent (or build houses in Classic for more).</li>
      </ul>
    `)}
    <div class="ch-tier-row" id="mpVariantRow"></div>
    <div class="ch-tier-row" id="mpAiRow"></div>
    <button class="btn" id="mpStartBtn" style="margin-top:4px;">Start</button>
  `;
  let variant = 'classic', aiCount = 1;
  const variantRow = document.getElementById('mpVariantRow');
  [['classic', 'Classic (full rules)'], ['quick', 'Quick (simplified)']].forEach(([id, label]) => {
    const b = document.createElement('button');
    b.className = 'diff-btn' + (id === variant ? ' active' : '');
    b.style.flex = '1 1 auto';
    b.textContent = label;
    b.addEventListener('click', () => { variant = id; variantRow.querySelectorAll('.diff-btn').forEach(el => el.classList.remove('active')); b.classList.add('active'); });
    variantRow.appendChild(b);
  });
  const aiRow = document.getElementById('mpAiRow');
  [1, 2, 3].forEach(n => {
    const b = document.createElement('button');
    b.className = 'diff-btn' + (n === aiCount ? ' active' : '');
    b.style.flex = '1 1 auto';
    b.textContent = n + ' AI opponent' + (n > 1 ? 's' : '');
    b.addEventListener('click', () => { aiCount = n; aiRow.querySelectorAll('.diff-btn').forEach(el => el.classList.remove('active')); b.classList.add('active'); });
    aiRow.appendChild(b);
  });
  document.getElementById('mpStartBtn').addEventListener('click', () => {
    mpStartGame(variant, aiCount);
    mpRenderBoard();
    if (mpTurnIdx !== 0) setTimeout(mpAiTakeTurn, 650);
  });
}

function renderMonopoly(resume) {
  if (mpShowSetup) { mpShowSetup = false; mpRenderSetup(); return; }
  if (resume) {
    if (mpPositions) { mpRenderBoard(); return; }
    mpRenderSetup();
    return;
  }
  if (!mpPositions) { mpRenderSetup(); return; }
  mpPositions = null;
  mpRenderSetup();
}

function mpGridPos(i) {
  if (i <= 10) return {row: 11, col: 11 - i};
  if (i <= 20) return {row: 11 - (i - 10), col: 1};
  if (i <= 30) return {row: 1, col: 1 + (i - 20)};
  return {row: 1 + (i - 30), col: 11};
}

function mpRenderBoard() {
  view.innerHTML = `
    <h2 class="game-title">Monopoly — ${mpVariant === 'classic' ? 'Classic' : 'Quick'}</h2>
    <div class="mp-layout">
      <div class="mp-board" id="mpBoard"></div>
      <div class="mp-side">
        <div class="mp-players" id="mpPlayers"></div>
        <div class="mp-status" id="mpStatus"></div>
        <div class="mp-dice" id="mpDice"></div>
        <div id="mpActions"></div>
        <div class="mp-properties" id="mpProps"></div>
        <div class="btn-row">
          <button class="btn ghost" id="mpChangeSettings">Change settings</button>
          <button class="btn ghost" id="mpNew">New game</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('mpChangeSettings').addEventListener('click', () => mpStartSetup());
  document.getElementById('mpNew').addEventListener('click', () => { mpPositions = null; renderMonopoly(); });

  const boardEl = document.getElementById('mpBoard');
  MP_BOARD.forEach((space, i) => {
    const pos = mpGridPos(i);
    const cell = document.createElement('div');
    cell.className = 'mp-space' + (i % 10 === 0 ? ' mp-corner' : '');
    cell.style.gridColumn = pos.col;
    cell.style.gridRow = pos.row;
    let html = '';
    if (space.type === 'property') html += `<div class="mp-color-bar" style="background:${MP_GROUP_COLOR[space.group]}"></div>`;
    html += `<div class="mp-space-name">${space.name}</div>`;
    if (space.price) html += `<div class="mp-space-price">$${space.price}</div>`;
    cell.innerHTML = html;
    const prop = mpProperties[i];
    if (prop) {
      cell.classList.add('mp-owned');
      cell.style.boxShadow = `inset 0 0 0 2px ${MP_TOKEN_COLOR[prop.owner]}`;
      if (prop.houses > 0 && prop.houses < 5) {
        const row = document.createElement('div');
        row.className = 'mp-tokens-row';
        for (let h = 0; h < prop.houses; h++) { const el = document.createElement('span'); el.className = 'mp-house'; row.appendChild(el); }
        cell.appendChild(row);
      } else if (prop.houses === 5) {
        const row = document.createElement('div'); row.className = 'mp-tokens-row';
        const el = document.createElement('span'); el.className = 'mp-hotel'; row.appendChild(el); cell.appendChild(row);
      }
      if (prop.mortgaged) { const m = document.createElement('div'); m.style.cssText = 'font-size:7px;color:#f88;'; m.textContent = 'MORT'; cell.appendChild(m); }
    }
    const tokRow = document.createElement('div');
    tokRow.className = 'mp-tokens-row';
    tokRow.style.top = '2px'; tokRow.style.bottom = 'auto'; tokRow.style.position = 'absolute';
    mpNames.forEach((n, pi) => { if (mpPositions[pi] === i && !mpBankrupt[pi]) { const t = document.createElement('span'); t.className = 'mp-token'; t.style.background = MP_TOKEN_COLOR[pi]; tokRow.appendChild(t); } });
    cell.appendChild(tokRow);
    boardEl.appendChild(cell);
  });
  const center = document.createElement('div');
  center.className = 'mp-center';
  center.setAttribute('role', 'img');
  center.setAttribute('aria-label', 'Monopoly');
  boardEl.appendChild(center);

  const playersEl = document.getElementById('mpPlayers');
  mpNames.forEach((name, i) => {
    const row = document.createElement('div');
    row.className = 'mp-player-row' + (mpTurnIdx === i && !mpOver ? ' active-turn' : '') + (mpBankrupt[i] ? ' bankrupt' : '');
    row.innerHTML = `<span>${name}</span><span>$${mpCash[i]}</span>`;
    playersEl.appendChild(row);
  });

  document.getElementById('mpStatus').textContent = mpOver ? mpMsg : (mpCardPopup || mpMsg || '');

  const diceEl = document.getElementById('mpDice');
  mpDice.forEach(d => { const el = document.createElement('div'); el.className = 'mp-die'; el.textContent = d; diceEl.appendChild(el); });

  mpRenderActions();
  mpRenderPropertyPanel();
}

function mpRenderActions() {
  const wrap = document.getElementById('mpActions');
  wrap.innerHTML = '';
  if (mpOver) { wrap.innerHTML = `<div class="mp-status">${mpMsg}</div>`; return; }
  if (mpTurnIdx !== 0) return;
  if (mpPendingAction === 'jailChoice') {
    const box = document.createElement('div');
    box.className = 'btn-row';
    const payBtn = document.createElement('button'); payBtn.className = 'btn'; payBtn.id = 'mpJailPay'; payBtn.textContent = 'Pay $50';
    payBtn.addEventListener('click', () => { mpPayBank(0, 50); mpInJail[0] = false; mpJailTurns[0] = 0; mpMsg = 'You paid $50 bail.'; mpPendingAction = 'roll'; mpRenderBoard(); });
    box.appendChild(payBtn);
    if (mpGetOutCards[0] > 0) {
      const cardBtn = document.createElement('button'); cardBtn.className = 'btn'; cardBtn.id = 'mpJailCard'; cardBtn.textContent = 'Use card';
      cardBtn.addEventListener('click', () => { mpGetOutCards[0]--; mpInJail[0] = false; mpJailTurns[0] = 0; mpMsg = 'You used a Get Out of Jail Free card.'; mpPendingAction = 'roll'; mpRenderBoard(); });
      box.appendChild(cardBtn);
    }
    const rollBtn = document.createElement('button'); rollBtn.className = 'btn ghost'; rollBtn.id = 'mpJailRoll'; rollBtn.textContent = 'Roll for doubles';
    rollBtn.addEventListener('click', () => {
      const d = [1 + Math.floor(Math.random() * 6), 1 + Math.floor(Math.random() * 6)];
      mpDice = d;
      if (d[0] === d[1]) { mpInJail[0] = false; mpJailTurns[0] = 0; mpMsg = 'Doubles! You\'re free.'; mpMovePlayer(0, d[0] + d[1]); mpResolveSpace(0); }
      else {
        mpJailTurns[0]++;
        if (mpJailTurns[0] >= 3) { mpPayBank(0, 50); mpInJail[0] = false; mpJailTurns[0] = 0; mpMsg = 'No doubles after 3 tries — paid $50 and moved.'; mpMovePlayer(0, d[0] + d[1]); mpResolveSpace(0); }
        else { mpMsg = 'No doubles. Still in jail.'; mpPendingAction = 'manage'; }
      }
      mpRenderBoard();
    });
    box.appendChild(rollBtn);
    wrap.appendChild(box);
    return;
  }
  if (mpPendingAction === 'roll') {
    const b = document.createElement('button'); b.className = 'btn'; b.id = 'mpRollBtn'; b.textContent = 'Roll dice';
    b.addEventListener('click', () => {
      const d = [1 + Math.floor(Math.random() * 6), 1 + Math.floor(Math.random() * 6)];
      mpDice = d;
      const doubles = d[0] === d[1];
      mpMovePlayer(0, d[0] + d[1]);
      mpResolveSpace(0);
      if (!mpOver) mpAfterRoll(0, doubles);
      mpRenderBoard();
    });
    wrap.appendChild(b);
    return;
  }
  if (mpPendingAction === 'buy') {
    const space = MP_BOARD[mpPendingSpace];
    const box = document.createElement('div'); box.className = 'mp-buy-card';
    box.innerHTML = `<div class="mp-bc-name">${space.name}</div><div>$${space.price}</div>`;
    const btnRow = document.createElement('div'); btnRow.className = 'btn-row';
    const buyBtn = document.createElement('button'); buyBtn.className = 'btn'; buyBtn.id = 'mpBuyBtn'; buyBtn.textContent = 'Buy';
    buyBtn.addEventListener('click', () => {
      mpCash[0] -= space.price;
      mpProperties[mpPendingSpace] = {owner: 0, houses: 0, mortgaged: false};
      mpMsg = `You bought ${space.name}.`;
      mpPendingAction = 'manage';
      mpRenderBoard();
    });
    const declineBtn = document.createElement('button'); declineBtn.className = 'btn ghost'; declineBtn.id = 'mpDeclineBtn'; declineBtn.textContent = 'Decline';
    declineBtn.addEventListener('click', () => {
      if (mpVariant === 'classic') mpAuction(mpPendingSpace);
      else mpMsg = `You passed on ${space.name}.`;
      mpPendingAction = 'manage';
      mpRenderBoard();
    });
    btnRow.appendChild(buyBtn); btnRow.appendChild(declineBtn);
    box.appendChild(btnRow);
    wrap.appendChild(box);
    return;
  }
  if (mpCardPopup) {
    const box = document.createElement('div'); box.className = 'mp-card-popup'; box.textContent = mpCardPopup;
    const okBtn = document.createElement('button'); okBtn.className = 'btn'; okBtn.id = 'mpCardOk'; okBtn.textContent = 'OK'; okBtn.style.marginTop = '10px';
    okBtn.addEventListener('click', () => { mpCardPopup = null; mpRenderBoard(); });
    box.appendChild(document.createElement('br'));
    box.appendChild(okBtn);
    wrap.appendChild(box);
    return;
  }
  if (mpPendingAction === 'manage') {
    const box = document.createElement('div'); box.className = 'btn-row';
    const endBtn = document.createElement('button'); endBtn.className = 'btn'; endBtn.id = 'mpEndTurnBtn'; endBtn.textContent = 'End turn';
    endBtn.addEventListener('click', () => { mpEndTurn(); mpAfterStateChange(); });
    box.appendChild(endBtn);
    wrap.appendChild(box);
  }
}

function mpRenderPropertyPanel() {
  const wrap = document.getElementById('mpProps');
  wrap.innerHTML = '';
  const owned = Object.keys(mpProperties).filter(k => mpProperties[k].owner === 0).map(Number);
  if (!owned.length) return;
  owned.forEach(i => {
    const space = MP_BOARD[i];
    const prop = mpProperties[i];
    const row = document.createElement('div');
    row.className = 'mp-property-item';
    const rt = space.type === 'property' ? mpRentTable(space.price) : null;
    let label = space.name + (prop.mortgaged ? ' (mortgaged)' : prop.houses === 5 ? ' (hotel)' : prop.houses > 0 ? ` (${prop.houses}h)` : '');
    row.innerHTML = `<span>${label}</span>`;
    const btns = document.createElement('span');
    if (mpVariant === 'classic' && mpTurnIdx === 0 && mpPendingAction !== 'buy' && mpPendingAction !== 'jailChoice') {
      if (space.type === 'property' && !prop.mortgaged && mpOwnsFullGroup(0, space.group) && prop.houses < 5) {
        const groupMin = Math.min(...mpGroupIndices(space.group).map(gi => mpProperties[gi].houses));
        if (prop.houses === groupMin && mpCash[0] >= rt.housePrice) {
          const b = document.createElement('button'); b.className = 'btn ghost'; b.style.fontSize = '11px'; b.style.padding = '2px 8px'; b.textContent = 'Build $' + rt.housePrice;
          b.addEventListener('click', () => { mpCash[0] -= rt.housePrice; prop.houses++; mpRenderBoard(); });
          btns.appendChild(b);
        }
      }
      if (space.type === 'property' && prop.houses > 0 && !prop.mortgaged) {
        const groupMax = Math.max(...mpGroupIndices(space.group).map(gi => mpProperties[gi].houses));
        if (prop.houses === groupMax) {
          const b = document.createElement('button'); b.className = 'btn ghost'; b.style.fontSize = '11px'; b.style.padding = '2px 8px'; b.textContent = 'Sell house';
          b.addEventListener('click', () => { prop.houses--; mpCash[0] += Math.round(rt.housePrice / 2); mpRenderBoard(); });
          btns.appendChild(b);
        }
      }
      if (prop.houses === 0) {
        if (!prop.mortgaged) {
          const mv = (space.type === 'property') ? rt.mortgage : Math.round(space.price / 2);
          const b = document.createElement('button'); b.className = 'btn ghost'; b.style.fontSize = '11px'; b.style.padding = '2px 8px'; b.textContent = 'Mortgage +$' + mv;
          b.addEventListener('click', () => { prop.mortgaged = true; mpCash[0] += mv; mpRenderBoard(); });
          btns.appendChild(b);
        } else {
          const mv = (space.type === 'property') ? rt.mortgage : Math.round(space.price / 2);
          const cost = Math.round(mv * 1.1);
          const b = document.createElement('button'); b.className = 'btn ghost'; b.style.fontSize = '11px'; b.style.padding = '2px 8px'; b.textContent = 'Unmortgage $' + cost;
          b.disabled = mpCash[0] < cost;
          b.addEventListener('click', () => { prop.mortgaged = false; mpCash[0] -= cost; mpRenderBoard(); });
          btns.appendChild(b);
        }
      }
    }
    row.appendChild(btns);
    wrap.appendChild(row);
  });
}

renderHub();
applyLang();
document.querySelectorAll('#langBar [data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

// ---------------- Options menu (the three dots) ----------------
// One place for: Water gun, Coaching, About This Game, New Game, Change Settings.
// The per-game "New game" / "New puzzle" / "Change settings" buttons and the
// "About the Game" block are hidden in favour of this menu; the menu items simply
// activate them, so every game keeps working exactly as before.
const OPT_NEW_RE = /^new (game|puzzle)$/i;
const OPT_SETTINGS_RE = /^change settings$/i;
function optIsNewLabel(t) { return OPT_NEW_RE.test(String(t || '').trim()); }
function optIsSettingsLabel(t) { return OPT_SETTINGS_RE.test(String(t || '').trim()); }
function optFind(re) {
  if (!view || typeof view.querySelectorAll !== 'function') return null;
  const all = view.querySelectorAll('button');
  for (let i = 0; i < all.length; i++) if (re(all[i].textContent)) return all[i];
  return null;
}
function optAdopt() {
  if (!view || typeof view.querySelectorAll !== 'function') return;
  view.querySelectorAll('button').forEach(b => {
    if (optIsNewLabel(b.textContent) || optIsSettingsLabel(b.textContent)) b.classList.add('opt-adopted');
  });
  view.querySelectorAll('.about-details').forEach(d => d.classList.add('opt-adopted'));
  // Coach tips live in the Options menu now (Hint notes stay where they are).
  view.querySelectorAll('.coach-box').forEach(d => { if (!d.classList.contains('hint-box')) d.classList.add('opt-adopted'); });
  optUpdateTipDot();
}
// Coach tips currently on this screen (HTML strings), newest content only.
function optCoachTips() {
  if (!coachingEnabled || !view || typeof view.querySelectorAll !== 'function') return [];
  const out = [];
  view.querySelectorAll('.coach-box').forEach(d => {
    if (d.classList.contains('hint-box')) return;
    const html = String(d.innerHTML || '').trim();
    if (html) out.push(html);
  });
  return out;
}
let optTipsSeen = '';
function optUpdateTipDot() {
  const btn = document.getElementById('optBtn');
  if (!btn || !btn.classList) return;
  const menu = document.getElementById('optMenu');
  const open = menu && !menu.hidden;
  const now = optCoachTips().join('|');
  if (open) optTipsSeen = now;
  btn.classList.toggle('has-tip', !!now && now !== optTipsSeen);
}
function optRenderCoach() {
  const box = document.getElementById('optCoach');
  if (!box) return;
  if (!coachingEnabled) { box.hidden = true; box.innerHTML = ''; return; }
  const tips = optCoachTips();
  box.hidden = false;
  box.innerHTML = tips.length
    ? tips.map(t => `<div class="opt-tip">${t}</div>`).join('')
    : '<div class="opt-tip opt-tip-empty">Coach is on \u2014 tips show up here as you play (start a new game for a fresh one).</div>';
}
function optCloseMenu() {
  const menu = document.getElementById('optMenu'), btn = document.getElementById('optBtn');
  if (menu) menu.hidden = true;
  if (btn) btn.setAttribute('aria-expanded', 'false');
}
function optSetItem(id, enabled) {
  const el = document.getElementById(id);
  if (!el) return;
  el.disabled = !enabled;
  el.setAttribute('aria-disabled', enabled ? 'false' : 'true');
}
function optOpenMenu() {
  const menu = document.getElementById('optMenu'), btn = document.getElementById('optBtn');
  if (!menu || !btn) return;
  optAdopt();
  optSetItem('optAbout', !!(view.querySelector && view.querySelector('.about-body')));
  optSetItem('optNew', !!optFind(optIsNewLabel));
  optSetItem('optSettings', !!optFind(optIsSettingsLabel));
  optRenderCoach();
  menu.hidden = false;
  btn.setAttribute('aria-expanded', 'true');
  optUpdateTipDot();
}
function optToggleMenu() {
  const menu = document.getElementById('optMenu');
  if (menu && menu.hidden) optOpenMenu(); else optCloseMenu();
}
function optShowAbout() {
  const body = view.querySelector && view.querySelector('.about-body');
  if (!body) return;
  const game = GAMES.find(g => g.id === currentGameId);
  const old = document.getElementById('aboutOverlay');
  if (old && old.parentNode) old.parentNode.removeChild(old);
  const overlay = document.createElement('div');
  overlay.id = 'aboutOverlay'; overlay.className = 'about-overlay';
  overlay.setAttribute('role', 'dialog'); overlay.setAttribute('aria-modal', 'true');
  overlay.innerHTML = `<div class="about-panel"><button class="podium-close" id="aboutClose" aria-label="Close">×</button>
    <h2 class="about-title">About ${game ? game.name : 'This Game'}</h2>
    <div class="about-content">${body.innerHTML}</div>
    <div class="btn-row" style="justify-content:center;"><button class="btn" id="aboutDone">Got it</button></div></div>`;
  document.body.appendChild(overlay);
  const close = () => { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  document.getElementById('aboutClose').addEventListener('click', close);
  document.getElementById('aboutDone').addEventListener('click', close);
}
/* Picture credits. Add one entry per licensed photo, e.g.
   { title:'Misty lake', by:'Jane Doe', site:'Unsplash', url:'https://unsplash.com/photos/XXXX', licence:'Unsplash Licence', used:'Jigsaw' } */
const PHOTO_CREDITS = [];
function optShowCredits() {
  const old = document.getElementById('creditsOverlay');
  if (old && old.parentNode) old.parentNode.removeChild(old);
  const esc = (t) => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const safeUrl = (u) => /^https:\/\//i.test(u) ? u : '';
  const rows = PHOTO_CREDITS.length ? PHOTO_CREDITS.map(c => {
    const u = safeUrl(c.url);
    return `<li class="credit-row"><b>${esc(c.title)}</b><span>Photo by ${esc(c.by)} on ${esc(c.site)} \u00b7 ${esc(c.licence)}${c.used ? ' \u00b7 ' + esc(c.used) : ''}</span>${u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">View original</a>` : ''}</li>`;
  }).join('') : '<li class="credit-row"><span>All pictures in this game table are original artwork made for it. No third-party photographs are used.</span></li>';
  const overlay = document.createElement('div');
  overlay.id = 'creditsOverlay'; overlay.className = 'about-overlay';
  overlay.setAttribute('role', 'dialog'); overlay.setAttribute('aria-modal', 'true');
  overlay.innerHTML = `<div class="about-panel"><button class="podium-close" id="creditsClose" aria-label="Close">\u00d7</button>
    <h2 class="about-title">Picture Credits</h2>
    <ul class="credit-list">${rows}</ul>
    <p class="credit-libs">Fonts: Inter and Fraunces, used under the SIL Open Font License 1.1. 3D engine: three.js, used under the MIT licence.</p>
    <div class="btn-row" style="justify-content:center;"><button class="btn" id="creditsDone">Close</button></div></div>`;
  document.body.appendChild(overlay);
  const close = () => { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  document.getElementById('creditsClose').addEventListener('click', close);
  document.getElementById('creditsDone').addEventListener('click', close);
}
(function wireOptionsMenu() {
  const btn = document.getElementById('optBtn');
  if (!btn) return;
  btn.addEventListener('click', (e) => { e.stopPropagation(); optToggleMenu(); });
  const coachBtn = document.getElementById('coachToggleBtn');
  if (coachBtn) coachBtn.addEventListener('click', () => { optRenderCoach(); optUpdateTipDot(); });
  document.getElementById('optAbout').addEventListener('click', () => { optCloseMenu(); optShowAbout(); });
  const cr = document.getElementById('optCredits'); if (cr) cr.addEventListener('click', () => { optCloseMenu(); optShowCredits(); });
  document.getElementById('optNew').addEventListener('click', () => { optCloseMenu(); const b = optFind(optIsNewLabel); if (b) b.click(); });
  document.getElementById('optSettings').addEventListener('click', () => { optCloseMenu(); const b = optFind(optIsSettingsLabel); if (b) b.click(); });
  document.addEventListener('click', (e) => {
    const menu = document.getElementById('optMenu');
    if (menu && !menu.hidden && !(menu.contains && menu.contains(e.target))) optCloseMenu();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') optCloseMenu(); });
  if (typeof MutationObserver === 'function') new MutationObserver(optAdopt).observe(view, { childList: true, subtree: true });
})();
</script>
