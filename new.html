}

function bilFrame(ts) {
  if (!bilRunning) return;
  const dt = Math.min(0.05, bilLastT ? (ts - bilLastT) / 1000 : 1 / 60);
  bilLastT = ts;
  const overlay = document.getElementById('pauseOverlay');
  const paused = overlay && overlay.classList && overlay.classList.contains('show');
  if (bilState && bilState.phase === 'rolling' && !paused) {
    bilStep(bilState.balls, dt, bilState.shot);
    if (!bilAnyMoving(bilState.balls)) bilResolveShot();
  }
  if (bil3d) bil3dRender(); else bilDraw();
  bilRafId = requestAnimationFrame(bilFrame);
}

function bilPointer(e) {
  if (bil3d) return bil3dPointer(e);
  const rect = bilCanvas.getBoundingClientRect();
  const sx = (BIL_W + BIL_RAIL * 2) / rect.width;
  return { x: (e.clientX - rect.left) * sx - BIL_RAIL, y: (e.clientY - rect.top) * sx - BIL_RAIL };
}

function bilOnDown(e) {

// ---- 3D view (Three.js) ----
// The physics and rules above stay 2D; this layer just draws them as a real
// table you can orbit 360° around. World axes: x = table length, z = table
// width, y = up, centred on the table; a logical (x, y) maps to (x - W/2, y - H/2).
let bil3d = null;            // { renderer, scene, camera, balls:{id:{mesh,shadow}}, cam:{theta,phi,r}, ... }

const bilPtrs = new Map();

function bil3dBallTexture(id) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#F7F4EA'; g.fillRect(0, 0, 512, 256);
  if (id > 0) {
    g.fillStyle = bilBallColor(id);
    if (id < 9) g.fillRect(0, 0, 512, 256); else g.fillRect(0, 70, 512, 116);
    [128, 384].forEach(x => {
      g.beginPath(); g.arc(x, 128, 38, 0, Math.PI * 2); g.fillStyle = '#F7F4EA'; g.fill();
      g.fillStyle = '#111'; g.font = 'bold 46px Inter, Arial, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(String(id), x, 131);
    });
  } else {
    g.fillStyle = '#C3563F'; [128, 384].forEach(x => { g.beginPath(); g.arc(x, 128, 7, 0, Math.PI * 2); g.fill(); });
  }
  const t = new THREE.CanvasTexture(c);
  return t;
}

function bil3dShadowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 4, 32, 32, 32);
  gr.addColorStop(0, 'rgba(0,0,0,0.55)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}

function bil3dStrip(color, opacity) {
  const geo = new THREE.PlaneGeometry(1, 1); geo.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthWrite: false }));
  m.renderOrder = 5; m.visible = false;
  return m;
}
function bil3dSetStrip(m, x1, z1, x2, z2, width, y) {
  const dx = x2 - x1, dz = z2 - z1, len = Math.hypot(dx, dz);
  if (len < 0.5) { m.visible = false; return; }
  m.visible = true;
  m.position.set((x1 + x2) / 2, y, (z1 + z2) / 2);
  m.rotation.y = -Math.atan2(dz, dx);
  m.scale.set(len, 1, width);
}

function bil3dFit(aspect) {
  const vf = 38 * Math.PI / 180;
  const hf = 2 * Math.atan(Math.tan(vf / 2) * aspect);
  const needW = (BIL_W + 90) / 2 / Math.tan(hf / 2);
  const needH = (BIL_H + 90) / 2 / Math.tan(vf / 2);
  return Math.max(needW, needH) * 1.02;
}

function bil3dApplyCamera() {
  if (!bil3d) return;
  const c = bil3d.cam;
  c.phi = Math.max(0.1, Math.min(1.5, c.phi));
  c.r = Math.max(320, Math.min(1500, c.r));
  bil3d.camera.position.set(c.r * Math.sin(c.phi) * Math.sin(c.theta), c.r * Math.cos(c.phi), c.r * Math.sin(c.phi) * Math.cos(c.theta));
  bil3d.camera.lookAt(0, 0, 0);
}

function bil3dSetView(kind) {
  if (!bil3d) return;
  const fit = bil3d.fitR;
  if (kind === 'top') { bil3d.cam.theta = 0; bil3d.cam.phi = 0.1; bil3d.cam.r = fit * 1.04; }
  else { bil3d.cam.theta = 0; bil3d.cam.phi = 0.95; bil3d.cam.r = fit * 1.1; }
  bil3dApplyCamera();
}

function bil3dInit(canvas, stage) {
  if (typeof THREE === 'undefined') return false;
  let renderer;

  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  const w = stage.clientWidth || 800, h = stage.clientHeight || 500;
  renderer.setSize(w, h, false);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, w / h, 5, 4000);
  scene.add(new THREE.AmbientLight(0xffffff, 0.62));
  const sun = new THREE.DirectionalLight(0xfff3dc, 0.75); sun.position.set(-260, 520, 180); scene.add(sun);
  const lamp = new THREE.PointLight(0xfff0d0, 0.45, 1600); lamp.position.set(0, 420, 0); scene.add(lamp);

  const mat = (color) => new THREE.MeshLambertMaterial({ color });

  const CU = 12, RL = 32;                       // cushion depth, wooden rail width

  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => box(34, 130, 34, sx * (lx / 2 - 28), -103, sz * (lz / 2 - 28), 0x2E1C0F));

  // Pockets in clockwise order, each with the cushion-area edge it is entered / left along.
  const EDGES = { top: { ax: 'z', v: -B, dir: 1 }, right: { ax: 'x', v: A, dir: 1 }, bottom: { ax: 'z', v: B, dir: -1 }, left: { ax: 'x', v: -A, dir: -1 } };

  const hits = (p, e) => {                       // where the pocket circle crosses an edge line, with its position along the walk

      <path d="M32 30 C12 30 12 58 36 62" fill="none" stroke="url(#${g}v)" stroke-width="5" stroke-linecap="round"/>
      <path d="M88 30 C108 30 108 58 84 62" fill="none" stroke="url(#${g}v)" stroke-width="5" stroke-linecap="round"/>
      <path d="M40 24 C40 8 80 8 80 24 Z" fill="url(#${g}h)"/>
      <circle cx="60" cy="8" r="4" fill="url(#${g}v)"/>
      <path d="M32 24 H88 C88 56 78 72 60 76 C42 72 32 56 32 24 Z" fill="url(#${g}h)"/>
      <path d="M40 30 C41 50 47 62 54 68" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3.5" stroke-linecap="round"/>
      <rect x="54" y="76" width="12" height="12" fill="url(#${g}h)"/>
      <path d="M42 98 C46 90 54 88 60 88 C66 88 74 90 78 98 Z" fill="url(#${g}h)"/>
      <rect x="32" y="98" width="56" height="20" rx="2" fill="#5a0f1a"/>
      <rect x="44" y="104" width="32" height="8" rx="1.5" fill="url(#${g}v)"/>`;
  } else {  // medal
    let bulbs = '';
    for (let k = 0; k < 16; k++) { const a = k / 16 * Math.PI * 2; bulbs += `<circle cx="${(60 + 37 * Math.cos(a)).toFixed(1)}" cy="${(52 + 37 * Math.sin(a)).toFixed(1)}" r="2.6" fill="#FFF7CF"/>`; }
    body = `
      <path d="M42 94 H78 L86 120 H34 Z" fill="#D7373F"/>
      <rect x="36" y="114" width="48" height="6" rx="2" fill="#B02A31"/>
      <circle cx="60" cy="52" r="42" fill="url(#${g}h)"/>${bulbs}
      <circle cx="60" cy="52" r="30" fill="url(#${g}v)" stroke="${m.ink}" stroke-opacity=".4" stroke-width="1.4"/>
      <path d="M38 52 C38 66 46 74 60 78 C74 74 82 66 82 52" fill="none" stroke="${m.ink}" stroke-opacity=".35" stroke-width="2" stroke-dasharray="3 3"/>
      <text x="60" y="65" text-anchor="middle" font-size="38" font-weight="800" font-family="Fraunces, Georgia, serif" fill="${m.ink}" fill-opacity=".8">${place}</text>`;
  }
  return `<svg class="pd-cup" viewBox="0 0 120 126" role="img" aria-label="${['', 'Gold', 'Silver', 'Bronze'][place]} ${style === 'medal' ? 'medal' : style === 'crown' ? 'crown award' : 'cup'}" xmlns="http://www.w3.org/2000/svg">${defs}${body}</svg>`;
}

function pdOrdinal(n) { return n + (n === 1 ? 'st' : n === 2 ? 'nd' : n === 3 ? 'rd' : 'th'); }

function pdRenderStage(entries, style) {
  const stage = document.getElementById('podiumStage');
  if (!stage) return;
  stage.setAttribute('data-pd-style', style);
  const cols = [2, 1, 3].filter(p => entries[p - 1]).map(p => {
    const e = entries[p - 1];
    return `<div class="pd-col pd-p${p}${e.you ? ' pd-you' : ''}" style="animation-delay:${(3 - p) * 0.22}s">
      <div class="pd-name">${e.name}${e.you ? ' <span class="pd-tag">you</span>' : ''}</div>
      <div class="pd-detail">${e.detail || ''}</div>
      ${pdCupSVG(style, p)}
      <div class="pd-block"><span>${p}</span></div>
    </div>`;
  }).join('');
  stage.innerHTML = cols;
}

function showPodium(opts) {
  if (typeof document === 'undefined' || !document.body) return null;
  const entries = (opts.entries || []).filter(Boolean);
  if (!entries.length) return null;
  const old = document.getElementById('podiumOverlay');
  if (old && old.parentNode) old.parentNode.removeChild(old);
  const pref = safeGet('podium-style', 'mix');
  const concrete = ['realistic', 'flat', 'laurel', 'medal', 'crown', 'winged', 'wood', 'burgundy'];
  let style = pref === 'mix' || !concrete.includes(pref) ? concrete[Math.floor(Math.random() * concrete.length)] : pref;
  const youIdx = entries.findIndex(e => e.you);
  const youPlace = youIdx + 1;
  const headline = youIdx < 0 ? 'Final standings'
    : youPlace === 1 ? 'Champion! You took 1st place'
    : youPlace === 2 ? 'Silver — you finished 2nd'
    : youPlace === 3 ? 'Bronze — you finished 3rd'
    : 'You finished ' + pdOrdinal(youPlace);
  const yesImg = (youPlace >= 1 && youPlace <= 3 && YES_PHOTOS.length)
    ? `<img class="pd-yes" id="podiumYes" alt="Celebrating" src="${YES_PHOTOS[Math.floor(Math.random() * YES_PHOTOS.length)]}">` : '';
  const overlay = document.createElement('div');
  overlay.id = 'podiumOverlay'; overlay.className = 'podium-overlay';
  overlay.setAttribute('role', 'dialog'); overlay.setAttribute('aria-modal', 'true'); overlay.setAttribute('aria-label', 'Final standings');
  const chips = PODIUM_STYLES.map(s => `<button class="pd-chip${(pref === s.id) || (!concrete.includes(pref) && s.id === 'mix') ? ' active' : ''}" id="pdPick-${s.id}">${s.label}</button>`).join('');
  const rest = entries.slice(3).map((e, i) => `<div class="pd-rest-row${e.you ? ' pd-you' : ''}"><b>${pdOrdinal(i + 4)}</b> ${e.name}${e.you ? ' (you)' : ''}<span>${e.detail || ''}</span></div>`).join('');
  overlay.innerHTML = `<div class="podium-panel" id="podiumPanel">
      <button class="podium-close" id="podiumClose" aria-label="Close">×</button>
      <div class="podium-kicker">${opts.game || 'Game'} · final standings</div>
      <h2 class="podium-title">${headline}</h2>
      ${yesImg}
      <div class="podium" id="podiumStage"></div>
      ${rest ? `<div class="podium-rest">${rest}</div>` : ''}
      <div class="pd-style-row" aria-label="Cup style">${chips}</div>
      <div class="btn-row" style="justify-content:center;"><button class="btn" id="podiumDone">Continue</button></div>
    </div>`;
  document.body.appendChild(overlay);
  pdRenderStage(entries, style);
  const close = () => { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) close(); });
  document.getElementById('podiumClose').addEventListener('click', close);
  const done = document.getElementById('podiumDone');

// Renders a stored milliseconds value as m:ss for the "Best time" score
// fields above; 0/undefined (no solve recorded yet) shows as a dash rather
// than a misleading "0:00".
function formatScoreClock(ms) {
  if (!ms) return '—';
  const secs = Math.floor(ms / 1000);
  const m = Math.floor(secs / 60);
  const s = String(secs % 60).padStart(2, '0');
  return m + ':' + s;
}

const MUNCH_N = 17;
const MUNCH_PLAYER_START = [15, 1];
const MUNCH_GHOST_STARTS = [[7,7], [7,9], [9,8]];
const MUNCH_POWER_CELLS = [[1,1], [1,15], [15,15], [9,1]];
const MUNCH_GHOST_COLORS = ['#A5402F', '#4A6FA5', '#C08A3E'];
let munchWalls, munchDots, munchPower, munchPlayerPos, munchGhosts, munchPoweredLeft, munchLives, munchEaten, munchTotal, munchOver, munchWon, munchStats;

function munchIsWall(r, c) {
  if (r <= 0 || r >= MUNCH_N-1 || c <= 0 || c >= MUNCH_N-1) return true;
  if (r % 2 === 0 && c % 2 === 0 && r >= 2 && r <= 14 && c >= 2 && c <= 14) return true;
  return false;
}

function munchSetup() {
  munchWalls = Array.from({length: MUNCH_N}, (_, r) => Array.from({length: MUNCH_N}, (_, c) => munchIsWall(r, c)));
  munchDots = Array.from({length: MUNCH_N}, () => Array(MUNCH_N).fill(false));
  munchPower = Array.from({length: MUNCH_N}, () => Array(MUNCH_N).fill(false));
  const reserved = new Set([MUNCH_PLAYER_START, ...MUNCH_GHOST_STARTS].map(p => p[0]+','+p[1]));
  MUNCH_POWER_CELLS.forEach(([r,c]) => { munchPower[r][c] = true; reserved.add(r+','+c); });
  munchTotal = 0;
  for (let r = 1; r < MUNCH_N-1; r++) {
    for (let c = 1; c < MUNCH_N-1; c++) {
      if (munchWalls[r][c]) continue;
      if (reserved.has(r+','+c)) continue;
      munchDots[r][c] = true;
      munchTotal++;
    }
  }
  munchTotal += MUNCH_POWER_CELLS.length;
  munchPlayerPos = [...MUNCH_PLAYER_START];
  munchGhosts = MUNCH_GHOST_STARTS.map((p, i) => ({ pos: [...p], color: MUNCH_GHOST_COLORS[i] }));
  munchPoweredLeft = 0;
  munchLives = 3;
  munchEaten = 0;
  munchOver = false;
  munchWon = false;
}

/* ---------------- DARTS ----------------

function dtSigma(who) {

}

function dtAiTarget(rem) {

    const a = i * 18 * Math.PI / 180;
    [(DT_R.bullOut + DT_R.trebleIn) / 2, (DT_R.trebleIn + DT_R.trebleOut) / 2, (DT_R.trebleOut + DT_R.doubleIn) / 2, (DT_R.doubleIn + DT_R.doubleOut) / 2].forEach(rad => cands.push({ x: Math.sin(a) * rad, y: -Math.cos(a) * rad }));
  }

  cands.forEach(c => {
    let tot = 0; const N = 28;
    for (let k = 0; k < N; k++) {
      const s = dtScoreAt(c.x + dtGauss() * sig, c.y + dtGauss() * sig).pts;
      const left = rem - s;
      tot += left === 0 ? 1000 : left < 0 ? -40 : s + (left <= 40 && left % 2 === 0 ? 8 : 0);

      label(String(n * 3), c * ((DT_R.trebleIn + DT_R.trebleOut) / 2), s * ((DT_R.trebleIn + DT_R.trebleOut) / 2), 11, '#111', 'rgba(255,255,255,.92)');
      label(String(n * 2), c * ((DT_R.doubleIn + DT_R.doubleOut) / 2), s * ((DT_R.doubleIn + DT_R.doubleOut) / 2), 11, '#111', 'rgba(255,255,255,.92)');

        <div class="sn-hud"><div><b id="snLen">0</b>Length</div><div><b id="snKills">0</b>Trapped</div><div><b id="snBest">${snStats.best || 0}</b>Best</div></div>
        <ol class="sn-board" id="snBoard"></ol>
        <div class="btn-row"><button class="btn" id="snBoost" type="button">Hold to boost</button><button class="btn ghost" id="snNew" type="button">New game</button></div>
        <div class="bj-stats" style="margin-top:18px;"><div><b id="snWins">${snStats.wins || 0}</b>Rounds won</div><div><b>${snStats.kills || 0}</b>Snakes trapped</div></div>
        ${badgeStickersHTML('snakearena')}
      </div>
    </div>`;
  const cv = document.getElementById('snCanvas'), wrap = document.getElementById('snWrap');
  const dpr = Math.min(2, window.devicePixelRatio || 1), cssW = Math.max(280, Math.min(720, (wrap.clientWidth || 720))), cssH = Math.round(cssW * 0.62);
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr); cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';
  const g = cv.getContext && cv.getContext('2d');
  sn.dpr = dpr;
  const gen = sn.gen;
  const setAim = (e) => {
    const rect = cv.getBoundingClientRect(); const x = e.clientX - rect.left - rect.width / 2, y = e.clientY - rect.top - rect.height / 2;
    if (Math.abs(x) + Math.abs(y) > 4) { sn.input.has = true; sn.input.ang = Math.atan2(y, x); }
  };
  cv.addEventListener('pointermove', setAim);
  cv.addEventListener('pointerdown', (e) => { setAim(e); if (e.pointerType === 'mouse' && e.button === 0) sn.player.boost = true; try { cv.setPointerCapture(e.pointerId); } catch (er) {} });
  const stopBoost = () => { if (sn) sn.player.boost = false; };
  cv.addEventListener('pointerup', stopBoost); cv.addEventListener('pointercancel', stopBoost);
  const bb = document.getElementById('snBoost');
  bb.addEventListener('pointerdown', (e) => { e.preventDefault(); if (sn.player.segs.length > 12) sn.player.boost = true; });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => bb.addEventListener(ev, stopBoost));
  document.getElementById('snNew').addEventListener('click', () => renderSnakeArena(false));
  if (!snKeysBound) {
    snKeysBound = true;
    const key = (down) => (e) => {
      if (!sn || !document.getElementById('snCanvas')) return;
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') { sn.keys.left = down; e.preventDefault(); }
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') { sn.keys.right = down; e.preventDefault(); }
      else if (e.code === 'Space') { if (down && sn.player.segs.length <= 12) return; sn.player.boost = down; e.preventDefault(); }
      if (down && (e.code === 'ArrowLeft' || e.code === 'ArrowRight' || e.code === 'KeyA' || e.code === 'KeyD')) sn.input.has = false;
    };
    document.addEventListener('keydown', key(true)); document.addEventListener('keyup', key(false));
  }
  let last = 0;
  const loop = (ts) => {
    if (!sn || sn.gen !== gen || !document.getElementById('snCanvas')) return;
    const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016; last = ts;
    snStep(dt);
    if (g) snDraw(g, cssW, cssH);
    if (sn.lbT <= 0) { sn.lbT = 0.4; snUpdateHud(); const w = document.getElementById('snWins'); if (w) w.textContent = (safeGet('sn-stats', snStats).wins) || 0; }
    requestAnimationFrame(loop);
  };
  snUpdateHud();
  requestAnimationFrame(loop);
}

function munchRenderBoard() {
  const gridEl = document.getElementById('munchGrid');
  gridEl.innerHTML = '';
  for (let r = 0; r < MUNCH_N; r++) {
    for (let c = 0; c < MUNCH_N; c++) {
      const cell = document.createElement('div');
      cell.className = 'munch-cell' + (munchWalls[r][c] ? ' wall' : '');
      if (!munchWalls[r][c]) {
        if (munchDots[r][c]) { const d = document.createElement('div'); d.className = 'munch-dot'; cell.appendChild(d); }
        if (munchPower[r][c]) { const d = document.createElement('div'); d.className = 'munch-power'; cell.appendChild(d); }
      }
      const ghostHere = munchGhosts.find(g => g.pos[0] === r && g.pos[1] === c);
      if (ghostHere) {
        const g = document.createElement('div');
        g.className = 'munch-ghost' + (munchPoweredLeft > 0 ? ' scared' : '');
        if (munchPoweredLeft === 0) g.style.background = ghostHere.color;
        cell.appendChild(g);
      }
      if (munchPlayerPos[0] === r && munchPlayerPos[1] === c) {
        const p = document.createElement('div');
        p.className = 'munch-player' + (munchPoweredLeft > 0 ? ' powered' : '');
        cell.appendChild(p);
      }
      gridEl.appendChild(cell);
    }
  }
  const status = document.getElementById('munchStatus');
  if (status && !munchOver) status.textContent = munchPoweredLeft > 0 ? `Powered up! (${munchPoweredLeft} moves left)` : 'Munch away.';
}

function munchGhostStep(ghost) {
  const [gr, gc] = ghost.pos;
  const [pr, pc] = munchPlayerPos;
  const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  const options = dirs.map(([dr,dc]) => [gr+dr, gc+dc]).filter(([nr,nc]) => nr >= 0 && nr < MUNCH_N && nc >= 0 && nc < MUNCH_N && !munchWalls[nr][nc]);
  if (!options.length) return;
  const fleeing = munchPoweredLeft > 0;
  let best = options[0];
  let bestDist = fleeing ? -Infinity : Infinity;
  options.forEach(([nr,nc]) => {
    const dist = Math.abs(nr-pr) + Math.abs(nc-pc);
    if ((fleeing && dist > bestDist) || (!fleeing && dist < bestDist)) { bestDist = dist; best = [nr,nc]; }
  });
  if (Math.random() < 0.15) best = options[Math.floor(Math.random()*options.length)];
  ghost.pos = best;
}

function munchMove(dr, dc) {
  if (munchOver) return;
  const [pr, pc] = munchPlayerPos;
  const nr = pr + dr, nc = pc + dc;
  if (munchWalls[nr][nc]) return;
  munchPlayerPos = [nr, nc];

  if (munchDots[nr][nc]) { munchDots[nr][nc] = false; munchEaten++; }
  if (munchPower[nr][nc]) { munchPower[nr][nc] = false; munchEaten++; munchPoweredLeft = 15; }

  munchGhosts.forEach(g => munchGhostStep(g));

  if (munchPoweredLeft > 0) munchPoweredLeft--;

  if (munchHandleCollisions()) return;

  if (munchEaten >= munchTotal) {
    munchOver = true; munchWon = true;
    pauseTimer();
    munchStats.wins++;
    safeSet('munch-stats', munchStats);
    awardBadges('munch', munchStats.wins);
    munchRenderBoard();
    celebrateWin(document.getElementById('munchGrid'));
    document.getElementById('munchStatus').textContent = 'Every dot eaten \u2014 you win!';
    document.getElementById('munchWins').textContent = munchStats.wins;
    return;
  }

  munchRenderBoard();
  document.getElementById('munchLivesDisplay').textContent = munchLives;
  document.getElementById('munchEatenDisplay').textContent = munchEaten;
}

function munchHandleCollisions() {
  const [pr, pc] = munchPlayerPos;
  const hitIdx = munchGhosts.findIndex(g => g.pos[0] === pr && g.pos[1] === pc);
  if (hitIdx === -1) return false;
  if (munchPoweredLeft > 0) {
    munchGhosts[hitIdx].pos = [...MUNCH_GHOST_STARTS[hitIdx]];
    munchRenderBoard();
    return false;
  }
  munchLives--;
  if (munchLives <= 0) {
    munchOver = true;
    pauseTimer();
    munchStats.losses++;
    safeSet('munch-stats', munchStats);
    munchRenderBoard();
    document.getElementById('munchStatus').textContent = 'Out of lives \u2014 game over.';
    document.getElementById('munchLosses').textContent = munchStats.losses;
    return true;
  }
  munchPlayerPos = [...MUNCH_PLAYER_START];
  munchGhosts.forEach((g, i) => { g.pos = [...MUNCH_GHOST_STARTS[i]]; });
  munchPoweredLeft = 0;
  munchRenderBoard();
  const status = document.getElementById('munchStatus');
  if (status) status.textContent = 'Caught! Lost a life \u2014 reset to start.';
  document.getElementById('munchLivesDisplay').textContent = munchLives;
  return true;
}

/* ---------------- LUDO ---------------- */
const LUDO_COLOR_ORDER = ['red', 'green', 'yellow', 'blue'];
const LUDO_HEX = { red: '#C53F34', green: '#3A8C5A', yellow: '#D4A017', blue: '#3A6FA8' };

function ludoRot([r, c]) { return [c, 14 - r]; }

// A simple, verifiably-closed rectangular ring (32 cells) used as the shared track.
function ludoBuildPath() {
  const path = [];
  for (let c = 3; c <= 10; c++) path.push([3, c]);   // top side, 8 cells
  for (let r = 3; r <= 10; r++) path.push([r, 11]);  // right side, 8 cells
  for (let c = 11; c >= 4; c--) path.push([11, c]);  // bottom side, 8 cells
  for (let r = 11; r >= 4; r--) path.push([r, 3]);   // left side, 8 cells
  return path;
}

const LUDO_PATH = ludoBuildPath();
const LOOP_LEN = LUDO_PATH.length; // 32
const HOME_LEN = 3;
const FINISH_S = LOOP_LEN + HOME_LEN + 1;

const LUDO_START_IDX = { red: 0, green: 8, yellow: 16, blue: 24 };

const LUDO_HOME_COL = { red: [[7,4],[7,5],[7,6]] };
LUDO_HOME_COL.green = LUDO_HOME_COL.red.map(ludoRot);
LUDO_HOME_COL.yellow = LUDO_HOME_COL.green.map(ludoRot);
LUDO_HOME_COL.blue = LUDO_HOME_COL.yellow.map(ludoRot);

const LUDO_YARD_SLOTS = { red: [[0,0],[0,2],[2,0],[2,2]] };
LUDO_YARD_SLOTS.green = LUDO_YARD_SLOTS.red.map(ludoRot);
LUDO_YARD_SLOTS.yellow = LUDO_YARD_SLOTS.green.map(ludoRot);
LUDO_YARD_SLOTS.blue = LUDO_YARD_SLOTS.yellow.map(ludoRot);

const LUDO_SAFE_INDICES = new Set();
LUDO_COLOR_ORDER.forEach(color => {
  LUDO_SAFE_INDICES.add(LUDO_START_IDX[color]);
  LUDO_SAFE_INDICES.add((LUDO_START_IDX[color] + 4) % LOOP_LEN);
});

let ludoTokens, ludoTurnIdx, ludoRollValue, ludoSixCount, ludoAwaiting, ludoOver, ludoStats, ludoMovableIdx, ludoFinishOrder, ludoMedals;
// Tokens captured (sent home) by the move that's about to render, queued
// here so ludoRenderBoard() can play the fly-off effect in the right cell
// right after it redraws (capture can happen several calls before the
// render that actually shows the result, depending on the six/turn logic).
let ludoPendingCaptures = [];
const LUDO_MEDAL_LABEL = { gold: '\u{1F947} Gold', silver: '\u{1F948} Silver', bronze: '\u{1F949} Bronze', loser: 'Loser' };

function ludoIsSafe(globalIdx) { return LUDO_SAFE_INDICES.has(globalIdx); }

function ludoCellForToken(color, s) {
  if (s <= 0 || s >= FINISH_S) return null;
  if (s <= LOOP_LEN) {
    const idx = (LUDO_START_IDX[color] + s - 1) % LOOP_LEN;
    return LUDO_PATH[idx];
  }
  return LUDO_HOME_COL[color][s - LOOP_LEN - 1];
}

    ludoTokens = {};
    LUDO_COLOR_ORDER.forEach(c => { ludoTokens[c] = [0,0,0,0]; });

    ludoSixCount = 0;
    ludoAwaiting = false;
    ludoOver = false;

        <li>After looping the board, turn into your own colored home column and get all four tokens to the center to win. You need the exact roll to finish each token.</li>
        <li>If you have more than one legal move on a roll, click the token you want to move.</li>

    `)}

    <div class="cp-table">

function ludoRenderBoard() {
  const gridEl = document.getElementById('ludoGrid');
  gridEl.innerHTML = '';

  const yardOwner = (r, c) => {
    if (r <= 2 && c <= 2) return 'red';
    if (r <= 2 && c >= 12) return 'green';
    if (r >= 12 && c >= 12) return 'yellow';
    if (r >= 12 && c <= 2) return 'blue';
    return null;
  };
  const pathIndexAt = {};
  LUDO_PATH.forEach(([r,c], i) => { pathIndexAt[r+','+c] = i; });
  const homeOwnerAt = (r, c) => {
    for (const color of LUDO_COLOR_ORDER) {
      if (LUDO_HOME_COL[color].some(([hr,hc]) => hr === r && hc === c)) return color;
    }
    return null;
  };

  for (let r = 0; r < 15; r++) {
    for (let c = 0; c < 15; c++) {
      const cell = document.createElement('div');
      cell.className = 'ludo-cell';
      const owner = yardOwner(r, c);
      const homeOwner = !owner ? homeOwnerAt(r, c) : null;
      const isCenter = !owner && !homeOwner && r === 7 && c === 7;
      const pIdx = !owner && !homeOwner && !isCenter ? pathIndexAt[r+','+c] : undefined;

      if (owner) cell.classList.add('yard-' + owner);
      else if (homeOwner) cell.classList.add('home-' + homeOwner);
      else if (isCenter) cell.classList.add('center');
      else if (pIdx !== undefined) { cell.classList.add('path'); if (ludoIsSafe(pIdx)) cell.classList.add('safe'); }

      gridEl.appendChild(cell);
    }
  }

  // Yard tokens (not yet on board)
  LUDO_COLOR_ORDER.forEach(color => {
    ludoTokens[color].forEach((s, i) => {
      if (s !== 0) return;
      const [r, c] = LUDO_YARD_SLOTS[color][i];
      const cellEl = gridEl.children[r * 15 + c];
      const tk = document.createElement('div');
      tk.className = 'ludo-token ' + color;
      cellEl.appendChild(tk);
    });
  });

  // On-board tokens (loop + home column), grouped by cell
  const grouped = {};
  LUDO_COLOR_ORDER.forEach(color => {
    ludoTokens[color].forEach((s, i) => {
      const cell = ludoCellForToken(color, s);
      if (!cell) return;
      const key = cell[0] + ',' + cell[1];
      if (!grouped[key]) grouped[key] = [];
      grouped[key].push({ color, i });
    });
  });
  const currentColor = LUDO_COLOR_ORDER[ludoTurnIdx];
  Object.entries(grouped).forEach(([key, list]) => {
    const [r, c] = key.split(',').map(Number);
    const cellEl = gridEl.children[r * 15 + c];
    const top = list[list.length - 1];
    const tk = document.createElement('div');
    tk.className = 'ludo-token ' + top.color;
    cellEl.appendChild(tk);
    if (list.length > 1) {
      const cnt = document.createElement('div');
      cnt.className = 'ludo-token-count';
      cnt.textContent = list.length;
      cellEl.appendChild(cnt);
    }
    if (currentColor === 'red' && ludoAwaiting && list.some(t => t.color === 'red' && ludoMovableIdx.includes(t.i))) {
      cellEl.classList.add('selectable');
      cellEl.addEventListener('click', () => {
        const redToken = list.find(t => t.color === 'red' && ludoMovableIdx.includes(t.i));
        if (redToken) ludoExecuteMove('red', redToken.i);
      });
    }
  });

  // Clickable yard tokens for red when awaiting an exit move
  if (currentColor === 'red' && ludoAwaiting) {
    ludoTokens.red.forEach((s, i) => {
      if (s !== 0 || !ludoMovableIdx.includes(i)) return;
      const [r, c] = LUDO_YARD_SLOTS.red[i];
      const cellEl = gridEl.children[r * 15 + c];
      cellEl.classList.add('selectable');
      cellEl.addEventListener('click', () => ludoExecuteMove('red', i));
    });
  }

  const die = document.getElementById('ludoDie');
  if (die) die.innerHTML = pipDieHTML(ludoRollValue);
  const rollBtn = document.getElementById('ludoRollBtn');
  if (rollBtn) rollBtn.disabled = ludoOver || currentColor !== 'red' || ludoRollValue !== null;

  const playersEl = document.getElementById('ludoPlayers');
  if (playersEl) {
    playersEl.innerHTML = '';
    const names = { red: 'You (Red)', green: 'Green', yellow: 'Yellow', blue: 'Blue' };
    LUDO_COLOR_ORDER.forEach(color => {
      const finished = ludoTokens[color].filter(s => s === FINISH_S).length;
      const row = document.createElement('div');
      row.className = color === currentColor && !ludoOver ? 'lp-active' : '';
      let label = `${finished}/4 home`;
      if (ludoOver && ludoMedals && ludoMedals[color]) {
        label = LUDO_MEDAL_LABEL[ludoMedals[color]];
      } else if (ludoFinishOrder && ludoFinishOrder.includes(color)) {
        label = 'Finished — waiting';
      }
      row.innerHTML = `<span class="lp-dot" style="background:${LUDO_HEX[color]}"></span>${names[color]}: ${label}`;
      playersEl.appendChild(row);
    });
  }

  if (ludoPendingCaptures.length) {
    gridEl.style.position = 'relative';
    const cellSize = gridEl.clientWidth / 15;
    ludoPendingCaptures.forEach(cap => {
      const [r, c] = LUDO_PATH[cap.gIdx];
      spawnCaptureFlyEffect(gridEl, '', 'ludo-token ' + cap.color, c * cellSize, r * cellSize, cellSize);
    });
    matchMoment(gridEl, 'Sent home!');
    ludoPendingCaptures = [];
  }
}

function ludoMovableTokens(color, roll) {
  const movable = [];
  ludoTokens[color].forEach((s, i) => {
    if (s === 0) { if (roll === 6) movable.push(i); return; }
    if (s >= FINISH_S) return;
    if (s + roll <= FINISH_S) movable.push(i);
  });
  return movable;
}

function ludoExecuteMove(color, idx) {
  const roll = ludoRollValue;
  const s = ludoTokens[color][idx];
  const newS = s === 0 ? 1 : s + roll;
  ludoTokens[color][idx] = newS;

  if (newS <= LOOP_LEN) {
    const gIdx = (LUDO_START_IDX[color] + newS - 1) % LOOP_LEN;
    if (!ludoIsSafe(gIdx)) {
      LUDO_COLOR_ORDER.forEach(oc => {
        if (oc === color) return;
        ludoTokens[oc].forEach((os, oi) => {
          if (os >= 1 && os <= LOOP_LEN && (LUDO_START_IDX[oc] + os - 1) % LOOP_LEN === gIdx) {
            ludoTokens[oc][oi] = 0;
            ludoPendingCaptures.push({ color: oc, gIdx });
          }
        });
      });
    }
  }

  ludoRollValue = null;
  ludoAwaiting = false;
  ludoMovableIdx = [];

  if (ludoTokens[color].every(t => t === FINISH_S) && !ludoFinishOrder.includes(color)) {
    ludoMarkFinished(color);
    if (ludoOver) return;
    ludoNextTurn();
    return;
  }

  ludoAfterMove(color, roll);
}

function ludoAfterMove(color, roll) {
  if (roll === 6 && ludoSixCount < 3) {
    ludoRenderBoard();
    const status = document.getElementById('ludoStatus');
    if (status) status.textContent = 'Rolled a 6 \u2014 roll again!';
    if (color !== 'red') setTimeout(ludoAiRoll, 600);
    return;
  }
  ludoNextTurn();
}

function ludoNextTurn() {
  if (ludoOver) return;
  ludoSixCount = 0;
  ludoTurnIdx = (ludoTurnIdx + 1) % 4;
  ludoRollValue = null;
  ludoAwaiting = false;
  const next = LUDO_COLOR_ORDER[ludoTurnIdx];
  if (ludoFinishOrder.includes(next)) { ludoNextTurn(); return; }
  ludoRenderBoard();
  const status = document.getElementById('ludoStatus');
  if (status) status.textContent = next === 'red' ? 'Your turn \u2014 roll the dice.' : (next.charAt(0).toUpperCase()+next.slice(1)) + ' is rolling\u2026';
  if (next !== 'red') setTimeout(ludoAiRoll, 700);
}

function ludoHumanRoll() {
  if (ludoOver || LUDO_COLOR_ORDER[ludoTurnIdx] !== 'red' || ludoRollValue !== null || ludoFinishOrder.includes('red')) return;
  const roll = 1 + Math.floor(Math.random() * 6);
  ludoRollValue = roll;
  if (roll === 6) ludoSixCount++; else ludoSixCount = 0;
  const status = document.getElementById('ludoStatus');

  if (ludoSixCount === 3) {
    if (status) status.textContent = 'Three 6s in a row \u2014 turn forfeited!';
    ludoRenderBoard();
    setTimeout(ludoNextTurn, 900);
    return;
  }

  const movable = ludoMovableTokens('red', roll);
  ludoMovableIdx = movable;
  if (!movable.length) {
    if (status) status.textContent = `Rolled ${roll} \u2014 no legal moves.`;
    ludoRenderBoard();
    if (roll === 6) { setTimeout(() => { ludoRollValue = null; ludoRenderBoard(); }, 900); }
    else { setTimeout(ludoNextTurn, 900); }
    return;
  }
  if (movable.length === 1) {
    if (status) status.textContent = `Rolled ${roll}.`;
    ludoRenderBoard();
    setTimeout(() => ludoExecuteMove('red', movable[0]), 500);
    return;
  }
  ludoAwaiting = true;
  if (status) status.textContent = `Rolled ${roll} \u2014 choose a token to move.`;
  ludoRenderBoard();
}

function ludoAiRoll() {
  if (ludoOver) return;
  const color = LUDO_COLOR_ORDER[ludoTurnIdx];
  if (color === 'red') return;
  if (ludoFinishOrder.includes(color)) { ludoNextTurn(); return; }
  const roll = 1 + Math.floor(Math.random() * 6);
  ludoRollValue = roll;
  if (roll === 6) ludoSixCount++; else ludoSixCount = 0;
  const status = document.getElementById('ludoStatus');

  if (ludoSixCount === 3) {
    if (status) status.textContent = 'Three 6s in a row \u2014 turn forfeited!';
    ludoRenderBoard();
    setTimeout(ludoNextTurn, 800);
    return;
  }

  const movable = ludoMovableTokens(color, roll);
  if (!movable.length) {
    if (status) status.textContent = `${color}: rolled ${roll}, no legal moves.`;
    ludoRenderBoard();
    if (roll === 6) setTimeout(ludoAiRoll, 700);
    else setTimeout(ludoNextTurn, 700);
    return;
  }
  const choice = ludoAiChooseMove(color, movable, roll);
  setTimeout(() => ludoExecuteMove(color, choice), 500);
}

function ludoAiChooseMove(color, movable, roll) {
  for (const idx of movable) {
    const s = ludoTokens[color][idx];
    const newS = s === 0 ? 1 : s + roll;
    if (newS <= LOOP_LEN) {
      const gIdx = (LUDO_START_IDX[color] + newS - 1) % LOOP_LEN;
      if (!ludoIsSafe(gIdx)) {
        const wouldCapture = LUDO_COLOR_ORDER.some(oc => oc !== color && ludoTokens[oc].some(os => os >= 1 && os <= LOOP_LEN && (LUDO_START_IDX[oc] + os - 1) % LOOP_LEN === gIdx));
        if (wouldCapture) return idx;
      }
    }
  }
  const yardExit = movable.find(idx => ludoTokens[color][idx] === 0);
  if (yardExit !== undefined) return yardExit;
  return movable.slice().sort((a,b) => ludoTokens[color][b] - ludoTokens[color][a])[0];
}

function ludoMarkFinished(color) {
  if (ludoFinishOrder.includes(color)) return;
  ludoFinishOrder.push(color);
  // Once three colors have brought all four tokens home, the ranking for
  // gold/silver/bronze is already decided and the one color left on the
  // board is the loser \u2014 no need to keep playing it out.
  if (ludoFinishOrder.length >= 3) {
    ludoEndGame();
  }
}

function ludoEndGame() {
  ludoOver = true;
  pauseTimer();
  // Finish order holds 1st, 2nd, (and maybe 3rd) place in the order tokens
  // came home; whoever is left over is the 4th-place loser. Ties can't
  // arise from this engine (tokens are moved one at a time, in turn, so no
  // two colors ever complete on the exact same step), but the ranking is
  // built generically from finish order so the gold/silver/bronze/loser
  // assignment always reflects 1st/2nd/3rd/4th place.
  const remaining = LUDO_COLOR_ORDER.filter(c => !ludoFinishOrder.includes(c));
  const ranking = [...ludoFinishOrder, ...remaining];
  const medals = {};
  const slots = ['gold', 'silver', 'bronze', 'loser'];
  ranking.forEach((color, i) => { medals[color] = slots[i]; });
  ludoMedals = medals;

  if (medals.red === 'gold') { ludoStats.wins++; awardBadges('ludo', ludoStats.wins); } else ludoStats.losses++;
  safeSet('ludo-stats', ludoStats);

  ludoRenderBoard();
  if (medals.red === 'gold') {
    celebrateWin(document.getElementById('ludoGrid'));
    matchMoment(document.getElementById('ludoGrid'), 'Champion!');
  }
  const status = document.getElementById('ludoStatus');
  const names = { red: 'You', green: 'Green', yellow: 'Yellow', blue: 'Blue' };
  if (status) {
    status.innerHTML = LUDO_COLOR_ORDER.map(c => `${names[c]}: ${LUDO_MEDAL_LABEL[medals[c]]}`).join(' &nbsp;|&nbsp; ');
  }
  document.getElementById('ludoWins').textContent = ludoStats.wins;
  document.getElementById('ludoLosses').textContent = ludoStats.losses;
  const podiumNames = { red: 'You', green: 'Green', yellow: 'Yellow', blue: 'Blue' };
  const podiumEntries = ranking.map((c, i) => ({ name: podiumNames[c], you: c === 'red', detail: ludoFinishOrder.includes(c) ? 'All four tokens home' : 'Still on the board' }));
  setTimeout(() => showPodium({ game: 'Ludo', entries: podiumEntries }), 900);
}

/* ---------------- JIGSAW PIECES (curved) ---------------- */
let jpSize = 5;
let jpImageId = 'sunburst';
let jpEdgeH, jpEdgeV;
let jpOrder = [];
let jpSelected = null;
let jpSolvedOnce = false;

function jpBuildEdges(n) {
  const edgeH = [];
  for (let r = 0; r <= n; r++) {
    const row = [];
    for (let c = 0; c < n; c++) row.push((r === 0 || r === n) ? 0 : (Math.random() < 0.5 ? 1 : -1));
    edgeH.push(row);
  }
  const edgeV = [];
  for (let r = 0; r < n; r++) {
    const row = [];
    for (let c = 0; c <= n; c++) row.push((c === 0 || c === n) ? 0 : (Math.random() < 0.5 ? 1 : -1));
    edgeV.push(row);
  }
  return { edgeH, edgeV };
}

function jpEdgeTypes(r, c, n) {
  const top = r === 0 ? 'flat' : (jpEdgeH[r][c] === 1 ? 'blank' : 'tab');
  const bottom = r === n - 1 ? 'flat' : (jpEdgeH[r+1][c] === 1 ? 'tab' : 'blank');
  const left = c === 0 ? 'flat' : (jpEdgeV[r][c] === 1 ? 'blank' : 'tab');
  const right = c === n - 1 ? 'flat' : (jpEdgeV[r][c+1] === 1 ? 'tab' : 'blank');
  return { top, bottom, left, right };
}

function jpBumpSegment(x0, y0, x1, y1, type) {
  if (type === 'flat') return `L ${x1} ${y1}`;
  const dx = x1 - x0, dy = y1 - y0;
  const len = Math.sqrt(dx*dx + dy*dy);
  const ux = dx / len, uy = dy / len;
  const p1x = x0 + ux*len*0.4, p1y = y0 + uy*len*0.4;
  const p2x = x0 + ux*len*0.6, p2y = y0 + uy*len*0.6;
  const r = len * 0.1;
  const sweep = type === 'tab' ? 1 : 0;
  return `L ${p1x} ${p1y} A ${r} ${r} 0 0 ${sweep} ${p2x} ${p2y} L ${x1} ${y1}`;
}

function jpPiecePath(edges, cell, margin) {
  const x0 = margin, y0 = margin, x1 = margin + cell, y1 = margin + cell;
  let d = `path('M ${x0} ${y0} `;
  d += jpBumpSegment(x0, y0, x1, y0, edges.top) + ' ';
  d += jpBumpSegment(x1, y0, x1, y1, edges.right) + ' ';
  d += jpBumpSegment(x1, y1, x0, y1, edges.bottom) + ' ';
  d += jpBumpSegment(x0, y1, x0, y0, edges.left) + ' ';
  d += "Z')";
  return d;
}

function renderJigsawPieces(resume) {
  view.innerHTML = `
    <h2 class="game-title">Jigsaw Pieces</h2>
    <p class="game-sub">Curved, interlocking pieces. Swap fragments until the picture lines up across every cut.</p>
    ${aboutBlock(`
      <p>Each grid slot has a fixed, interlocking piece shape &mdash; what shuffles is which part of the picture shows through it.</p>
      <ul>
        <li>Click a piece, then click another to swap the picture fragments between them.</li>
        <li>The die-cut shapes always interlock with their neighbors; solving means lining up the image itself.</li>
        <li>Choose a grid size from 3&times;3 up to 10&times;10.</li>
        <li>Pick from the same original artworks as the square-tile Jigsaw.</li>
      </ul>
    `)}
    ${coachBlock([
      'Look for color and pattern continuity across a piece\u2019s edge, not just the piece itself \u2014 that\u2019s the real clue.',
      'Corner and edge pieces (with straight sides) are the easiest to place with confidence first.',
      'Work in small regions rather than jumping around the whole board at once.',
      'A swap is never wasted \u2014 you can always swap back if it doesn\u2019t look right.'
    ])}
    <div class="jig-wrap">
      <div class="jp-board" id="jpBoard"></div>
      <div class="jp-side">
        <div class="jig-size-control">
          <label for="jpSizeSlider">Grid size: <span id="jpSizeLabel">${jpSize}\u00d7${jpSize}</span></label>
          <input type="range" id="jpSizeSlider" min="3" max="10" step="1" value="${jpSize}">
        </div>
        <div class="diff-row" id="jpPhotoRow" style="flex-wrap:wrap;"></div>
        <div class="btn-row" style="margin-top:0;">
          <button class="btn ghost" id="jpShuffle">Shuffle</button>
        </div>
        <div class="jig-solved-msg" id="jpMsg"></div>
      </div>
    </div>
  `;
  const sizeSlider = document.getElementById('jpSizeSlider');
  const sizeLabel = document.getElementById('jpSizeLabel');
  sizeSlider.addEventListener('input', () => { sizeLabel.textContent = sizeSlider.value + '\u00d7' + sizeSlider.value; });
  sizeSlider.addEventListener('change', () => { jpSize = parseInt(sizeSlider.value, 10); jpStart(); });

  const photoRow = document.getElementById('jpPhotoRow');
  JIG_IMAGES.forEach(img => {
    const b = document.createElement('button');
    b.className = 'diff-btn' + (img.id === jpImageId ? ' active' : '');
    b.textContent = img.name;
    b.style.flex = '1 1 auto';
    b.addEventListener('click', () => {
      jpImageId = img.id;
      photoRow.querySelectorAll('.diff-btn').forEach(el => el.classList.remove('active'));
      b.classList.add('active');
      jpStart();
    });
    photoRow.appendChild(b);
  });
  document.getElementById('jpShuffle').addEventListener('click', jpStart);
  if (resume && jpOrder && jpOrder.length) jpRenderPieces(); else jpStart();
}

function jpStart() {
  jpSolvedOnce = false;
  const n = jpSize;
  const edges = jpBuildEdges(n);
  jpEdgeH = edges.edgeH;
  jpEdgeV = edges.edgeV;
  const total = n * n;
  jpOrder = Array.from({length: total}, (_, i) => i);
  do {
    for (let i = jpOrder.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [jpOrder[i], jpOrder[j]] = [jpOrder[j], jpOrder[i]];
    }
  } while (total > 1 && jpOrder.every((v, i) => v === i));
  jpSelected = null;
  const msg = document.getElementById('jpMsg');
  if (msg) msg.textContent = '';
  jpRenderPieces();
}

function jpRenderPieces() {
  const board = document.getElementById('jpBoard');
  const n = jpSize;
  const boardSize = board.clientWidth || 460;
  const cell = boardSize / n;
  const margin = cell * 0.2;
  const outer = cell * 1.4;
  const imageUrl = jigGetImageUrl(jpImageId);

  board.innerHTML = '';
  jpOrder.forEach((origIndex, pos) => {
    const row = Math.floor(pos / n), col = pos % n;
    const origRow = Math.floor(origIndex / n), origCol = origIndex % n;
    const edges = jpEdgeTypes(row, col, n);

    const piece = document.createElement('div');
    piece.className = 'jp-piece';
    piece.dataset.pos = pos;
    piece.style.width = outer + 'px';
    piece.style.height = outer + 'px';
    piece.style.left = (col * cell - margin) + 'px';
    piece.style.top = (row * cell - margin) + 'px';
    piece.style.clipPath = jpPiecePath(edges, cell, margin);
    piece.style.zIndex = (edges.top === 'tab' || edges.left === 'tab' || edges.right === 'tab' || edges.bottom === 'tab') ? 2 : 1;

    const bgSizePct = (n / 1.4) * 100;
    const bgPosX = (100 * (0.2 - origCol) / (1.4 - n));
    const bgPosY = (100 * (0.2 - origRow) / (1.4 - n));
    piece.style.backgroundImage = `url("${imageUrl}")`;
    piece.style.backgroundSize = `${bgSizePct}% ${bgSizePct}%`;
    piece.style.backgroundPosition = `${bgPosX}% ${bgPosY}%`;

    piece.addEventListener('click', () => jpHandleClick(pos));
    board.appendChild(piece);
  });
}

function jpHandleClick(pos) {
  const board = document.getElementById('jpBoard');
  if (jpSelected === null) {
    jpSelected = pos;
    board.children[pos].classList.add('selected');
    return;
  }
  if (jpSelected === pos) {
    board.children[pos].classList.remove('selected');
    jpSelected = null;
    return;
  }
  const tmp = jpOrder[jpSelected];
  jpOrder[jpSelected] = jpOrder[pos];
  jpOrder[pos] = tmp;
  jpSelected = null;
  jpRenderPieces();
  jpCheckSolved();
}

function jpCheckSolved() {
  const solved = jpOrder.every((v, i) => v === i);
  const msg = document.getElementById('jpMsg');
  let newBestNote = '';
  if (solved) {
    pauseTimer();
    if (!jpSolvedOnce) {
      jpSolvedOnce = true;
      const elapsed = gameElapsedMs['jigsawpieces'] || 0;
      const { isNewBest } = recordPuzzleSolve('jigP-stats', elapsed);
      if (isNewBest) newBestNote = ' New best time!';
    }
  }
  if (msg) msg.textContent = solved ? ('Solved! Every fragment lines up.' + newBestNote) : '';
}

// ---------------- Water Sort (bottle-flip colour puzzle) ----------------
// Pour the top layer of one bottle onto another bottle whose top layer is the
// same colour (or onto an empty one). Sort every colour into its own bottle;
// each bottle that fills with a single colour gets capped and does a flip.
const WS_CAP = 4;
const WS_COLORS = [
  { name: 'Red', hex: '#e5484d' }, { name: 'Orange', hex: '#f5822a' }, { name: 'Yellow', hex: '#f6c928' },
  { name: 'Lime', hex: '#8bd03c' }, { name: 'Green', hex: '#1f9d55' }, { name: 'Teal', hex: '#18b6b0' },
  { name: 'Sky', hex: '#4aa8ff' }, { name: 'Blue', hex: '#2c4fd6' }, { name: 'Purple', hex: '#8a4fd8' },
  { name: 'Pink', hex: '#f06bb5' }, { name: 'Brown', hex: '#8a5a3a' },
];

function wsTop(b) { return b.length ? b[b.length - 1] : null; }
function wsTopRun(b) { let n = 0; for (let i = b.length - 1; i >= 0 && b[i] === b[b.length - 1]; i--) n++; return n; }
function wsUniform(b) { return b.length > 0 && b.every(c => c === b[0]); }
function wsCanPour(bs, a, b) {
  if (a === b || !bs[a] || !bs[b]) return false;
  const A = bs[a], B = bs[b];
  if (!A.length || B.length >= WS_CAP) return false;
  return !B.length || wsTop(B) === wsTop(A);
}
function wsPour(bs, a, b) {
  const next = bs.map(x => x.slice());
  const n = Math.min(wsTopRun(next[a]), WS_CAP - next[b].length);
  const color = wsTop(next[a]);
  for (let i = 0; i < n; i++) next[b].push(next[a].pop());
  return { state: next, count: n, color };
}
function wsIsWon(bs) { return bs.every(b => b.length === 0 || (b.length === WS_CAP && wsUniform(b))); }
function wsKey(bs) { return bs.map(b => b.join('.')).sort().join('|'); }

// Depth-first solver (node-limited). Returns a list of [from, to] moves, or null.
function wsSolve(bs, limit) {
  limit = limit || 30000;
  const seen = new Set(); let nodes = 0; const path = [];
  function dfs(s) {
    if (wsIsWon(s)) return true;
    if (++nodes > limit) return false;
    const k = wsKey(s); if (seen.has(k)) return false; seen.add(k);
    const moves = [];
    for (let a = 0; a < s.length; a++) {
      if (!s[a].length) continue;
      if (s[a].length === WS_CAP && wsUniform(s[a])) continue;           // already done
      for (let b = 0; b < s.length; b++) {
        if (!wsCanPour(s, a, b)) continue;
        if (!s[b].length && wsUniform(s[a])) continue;                    // pointless: uniform -> empty
        const gain = (s[b].length ? 2 : 0) + wsTopRun(s[a]) + (wsUniform(s[a]) ? 1 : 0);
        moves.push([a, b, gain]);
      }
    }
    moves.sort((x, y) => y[2] - x[2]);
    for (const [a, b] of moves) {
      path.push([a, b]);
      if (dfs(wsPour(s, a, b).state)) return true;
      path.pop();
      if (nodes > limit) return false;
    }
    return false;
  }
  return dfs(bs) ? path.slice() : null;
}

function wsColorCountFor(level, base) { return Math.min(WS_COLORS.length, base + Math.floor((level - 1) / 2)); }
function wsGenerate(colors, empties, rng) {
  rng = rng || Math.random; empties = empties == null ? 2 : empties;
  let last = null;
  for (let attempt = 0; attempt < 80; attempt++) {
    const segs = [];
    for (let c = 0; c < colors; c++) for (let i = 0; i < WS_CAP; i++) segs.push(c);
    for (let i = segs.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [segs[i], segs[j]] = [segs[j], segs[i]]; }
    const bs = [];
    for (let c = 0; c < colors; c++) bs.push(segs.slice(c * WS_CAP, (c + 1) * WS_CAP));
    for (let e = 0; e < empties; e++) bs.push([]);
    last = bs;
    if (bs.some(b => wsUniform(b) && b.length === WS_CAP)) continue;      // don't hand out a solved bottle
    if (wsSolve(bs, 20000)) return bs;
  }
  return last;
}

let wsBottles = null, wsSel = null, wsHist = [], wsMoves = 0, wsLevel = safeGet('ws-level', 1), wsBusy = false,
    wsWon = false, wsHint = null, wsExtraUsed = false, wsFlip = {}, wsStats = safeGet('ws-stats', { levels: 0, best: 0 });

function wsBaseColors() { return gameLevel === 'easy' ? 3 : gameLevel === 'hard' ? 5 : 4; }
function wsStartLevel(level) {

}

  `;
  document.getElementById('wsUndo').addEventListener('click', wsUndo);
  document.getElementById('wsHintBtn').addEventListener('click', wsShowHint);
  document.getElementById('wsAddBtn').addEventListener('click', wsAddBottle);
  document.getElementById('wsRestart').addEventListener('click', () => { wsStartLevel(wsLevel); renderWaterSort(true); });
  document.getElementById('wsNext').addEventListener('click', () => { wsStartLevel(wsLevel + 1); startTimer(); renderWaterSort(true); });
  wsRender();
}

function wsAria(b, i) {
  return 'Bottle ' + (i + 1) + ': ' + (b.length ? b.map(c => WS_COLORS[c].name).join(', ') + ' (bottom to top)' : 'empty');
}
function wsRender() {
  const rack = document.getElementById('wsRack');
  if (!rack) return;
  rack.innerHTML = wsBottles.map((b, i) => {
    const done = b.length === WS_CAP && wsUniform(b);
    const cls = 'ws-bottle' + (wsSel === i ? ' sel' : '') + (done ? ' done' : '') + (wsFlip[i] ? ' flip' : '') + (wsHint && (wsHint[0] === i || wsHint[1] === i) ? ' hint' : '');
    const segs = b.map(c => `<i class="ws-seg" style="background:${WS_COLORS[c].hex}"></i>`).join('');
    return `<button class="${cls}" id="wsB${i}" aria-label="${wsAria(b, i)}"><span class="ws-lip"></span><span class="ws-glass">${segs}</span></button>`;
  }).join('');
  wsBottles.forEach((b, i) => { const el = document.getElementById('wsB' + i); if (el) el.addEventListener('click', () => wsTap(i)); });
  wsFlip = {};
  const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
  set('wsLevelDisp', wsLevel); set('wsMovesDisp', wsMoves); set('wsClearedDisp', wsStats.levels || 0);
  const undo = document.getElementById('wsUndo'); if (undo) undo.disabled = !wsHist.length || wsBusy;
  const add = document.getElementById('wsAddBtn'); if (add) add.disabled = wsExtraUsed || wsWon;
}

function wsTap(i) {
  if (wsBusy || wsWon) return;
  wsHint = null;
  if (wsSel === null) { if (wsBottles[i].length) { wsSel = i; wsRender(); } return; }
  if (wsSel === i) { wsSel = null; wsRender(); return; }
  if (!wsCanPour(wsBottles, wsSel, i)) {
    const msg = document.getElementById('wsMsg');
    if (msg) msg.textContent = wsBottles[i].length >= WS_CAP ? 'That bottle is full.' : 'Colours must match, or pour onto an empty bottle.';
    if (wsBottles[i].length && wsSel !== i) wsSel = i;      // switch selection to the tapped bottle
    wsRender(); return;
  }
  const from = wsSel; wsSel = null;
  const msg = document.getElementById('wsMsg'); if (msg) msg.textContent = '';
  wsAnimatePour(from, i, () => wsApplyMove(from, i));
}

// Tilts the source bottle over the destination and draws a stream of water.
function wsAnimatePour(a, b, done) {
  const src = document.getElementById('wsB' + a), dst = document.getElementById('wsB' + b), rack = document.getElementById('wsRack');
  if (!src || !dst || !rack || typeof src.getBoundingClientRect !== 'function') { done(); return; }
  wsBusy = true;
  try {
    const s = src.getBoundingClientRect(), d = dst.getBoundingClientRect(), r = rack.getBoundingClientRect();
    const dir = d.left >= s.left ? 1 : -1;
    const tx = (d.left - s.left) - dir * 30, ty = (d.top - s.top) - 58;
    src.style.zIndex = '6';
    src.style.transform = `translate(${tx}px, ${ty}px) rotate(${dir * 68}deg)`;
    const color = WS_COLORS[wsTop(wsBottles[a])].hex;
    const st = document.createElement('div');
    st.className = 'ws-stream'; st.style.background = color;
    st.style.left = (d.left - r.left + d.width / 2 - 3) + 'px';
    st.style.top = (d.top - r.top - 22) + 'px';
    st.style.height = '70px';
    rack.appendChild(st);
  } catch (e) { /* animation is cosmetic */ }
  setTimeout(() => { wsBusy = false; done(); }, 620);
}

function wsApplyMove(a, b) {
  wsHist.push({ bottles: wsBottles.map(x => x.slice()), moves: wsMoves });
  const before = wsBottles[b].length === WS_CAP && wsUniform(wsBottles[b]);
  wsBottles = wsPour(wsBottles, a, b).state;
  wsMoves++;
  const nowDone = wsBottles[b].length === WS_CAP && wsUniform(wsBottles[b]);
  if (nowDone && !before) wsFlip[b] = true;
  wsRender();
  if (wsIsWon(wsBottles)) wsFinish();
}
function wsUndo() {
  if (wsBusy || !wsHist.length) return;
  const h = wsHist.pop(); wsBottles = h.bottles; wsMoves = h.moves; wsSel = null; wsHint = null; wsWon = false;
  const nx = document.getElementById('wsNext'); if (nx) nx.style.display = 'none';
  const msg = document.getElementById('wsMsg'); if (msg) msg.textContent = '';
  wsRender();
}
function wsAddBottle() {
  if (wsExtraUsed || wsWon || wsBusy) return;
  wsExtraUsed = true; wsBottles.push([]); wsSel = null; wsHint = null; wsRender();
}
function wsShowHint() {
  if (wsBusy || wsWon) return;
  const sol = wsSolve(wsBottles, 30000);
  const msg = document.getElementById('wsMsg');
  if (!sol || !sol.length) { wsHint = null; if (msg) msg.textContent = 'No hint found from here — try Undo, or add a bottle.'; wsRender(); return; }
  wsHint = sol[0]; wsSel = null;
  if (msg) msg.textContent = 'Try pouring bottle ' + (wsHint[0] + 1) + ' into bottle ' + (wsHint[1] + 1) + '.';
  wsRender();
}
function wsFinish() {
  wsWon = true;
  pauseTimer();
  wsStats.levels = (wsStats.levels || 0) + 1;
  wsStats.best = Math.max(wsStats.best || 0, wsLevel);
  safeSet('ws-stats', wsStats);
  awardBadges('watersort', wsStats.levels);
  const msg = document.getElementById('wsMsg');
  if (msg) msg.textContent = 'Level ' + wsLevel + ' cleared in ' + wsMoves + ' moves!';
  const nx = document.getElementById('wsNext'); if (nx) nx.style.display = '';
  const rack = document.getElementById('wsRack'); if (rack) celebrateWin(rack);
  const c = document.getElementById('wsClearedDisp'); if (c) c.textContent = wsStats.levels;
}

function bcShapeBounds(cells) {
  const maxR = Math.max(...cells.map(c => c[0]));
  const maxC = Math.max(...cells.map(c => c[1]));
  return { rows: maxR + 1, cols: maxC + 1 };
}

function bcCanPlaceAt(cells, r, c) {
  return cells.every(([dr,dc]) => {
    const rr = r+dr, cc = c+dc;
    return rr >= 0 && rr < BC_N && cc >= 0 && cc < BC_N && !bcGrid[rr][cc];
  });
}

function bcCanPlaceAnywhere(cells) {
  for (let r = 0; r < BC_N; r++) for (let c = 0; c < BC_N; c++) if (bcCanPlaceAt(cells, r, c)) return true;
  return false;
}

function bcRenderTray() {
  const tray = document.getElementById('bcTray');
  tray.innerHTML = '';
  bcShapes.forEach((shape, idx) => {
    const card = document.createElement('div');
    card.className = 'bc-shape-card' + (bcSelected === idx ? ' selected' : '') + (shape.used ? ' used' : '');
    if (!shape.used) {
      const { rows, cols } = bcShapeBounds(shape.cells);
      const mini = document.createElement('div');
      mini.className = 'bc-shape-mini';
      mini.style.gridTemplateColumns = `repeat(${cols}, 14px)`;
      mini.style.gridTemplateRows = `repeat(${rows}, 14px)`;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const on = shape.cells.some(([dr,dc]) => dr===r && dc===c);
          const cell = document.createElement('div');
          cell.className = on ? 'on' : 'off';
          if (on) cell.style.background = shape.color;
          mini.appendChild(cell);
        }
      }
      card.appendChild(mini);
      card.addEventListener('click', () => { bcSelected = (bcSelected === idx) ? null : idx; bcRenderTray(); bcRenderGrid(); });
    }
    tray.appendChild(card);
  });
}

function bcRenderGrid() {
  const gridEl = document.getElementById('bcGrid');
  gridEl.innerHTML = '';
  bcCellEls = [];
  for (let r = 0; r < BC_N; r++) {
    for (let c = 0; c < BC_N; c++) {
      const cell = document.createElement('div');
      cell.className = 'bc-cell';
      if (bcGrid[r][c]) { cell.classList.add('filled'); cell.style.background = bcGrid[r][c]; }
      cell.addEventListener('click', () => bcHandleCellClick(r, c));
      cell.addEventListener('mouseenter', () => bcShowPreview(r, c));
      cell.addEventListener('mouseleave', () => bcClearPreview());
      gridEl.appendChild(cell);
      bcCellEls.push(cell);
    }
  }
}

// Hover preview updates only toggle classes on the already-existing cell
// elements rather than rebuilding the grid. Rebuilding on every hover (the
// previous approach) replaced the exact DOM node a finger was touching in
// the middle of a tap, which makes touch browsers cancel the click entirely
// — that was why placing a piece by tapping could silently do nothing.
function bcShowPreview(hoverR, hoverC) {
  bcClearPreview();
  if (bcSelected === null || !bcCellEls) return;
  const shape = bcShapes[bcSelected];
  const ok = bcCanPlaceAt(shape.cells, hoverR, hoverC);
  shape.cells.forEach(([dr,dc]) => {
    const rr = hoverR + dr, cc = hoverC + dc;
    if (rr >= 0 && rr < BC_N && cc >= 0 && cc < BC_N) {
      bcCellEls[rr * BC_N + cc].classList.add(ok ? 'preview-ok' : 'preview-bad');
    }
  });
}

function bcClearPreview() {
  if (!bcCellEls) return;
  bcCellEls.forEach(cell => cell.classList.remove('preview-ok', 'preview-bad'));
}

function bcRender() {
  bcRenderTray();
  bcRenderGrid();
  document.getElementById('bcScoreDisplay').textContent = bcScore;
}

function bcHandleCellClick(r, c) {
  if (bcOver || bcSelected === null) return;
  const shape = bcShapes[bcSelected];
  if (!bcCanPlaceAt(shape.cells, r, c)) {
    const msg = document.getElementById('bcMsg');
    if (msg) msg.textContent = "Doesn't fit there.";
    return;
  }
  shape.cells.forEach(([dr,dc]) => { bcGrid[r+dr][c+dc] = shape.color; });
  shape.used = true;
  bcScore += shape.cells.length;
  bcSelected = null;

  const clearedLines = bcClearLines();
  if (clearedLines > 0) bcScore += clearedLines * 10 * clearedLines;

  if (bcShapes.every(s => s.used)) bcNewTray();

  const msg = document.getElementById('bcMsg');
  if (msg) msg.textContent = clearedLines > 0 ? `Cleared ${clearedLines} line${clearedLines>1?'s':''}!` : '';

  bcRender();
  bcCheckGameOver();
}

function bcClearLines() {
  const fullRows = [];
  const fullCols = [];
  for (let r = 0; r < BC_N; r++) if (bcGrid[r].every(v => v)) fullRows.push(r);
  for (let c = 0; c < BC_N; c++) if (bcGrid.every(row => row[c])) fullCols.push(c);
  fullRows.forEach(r => { for (let c = 0; c < BC_N; c++) bcGrid[r][c] = null; });
  fullCols.forEach(c => { for (let r = 0; r < BC_N; r++) bcGrid[r][c] = null; });
  return fullRows.length + fullCols.length;
}

function bcCheckGameOver() {
  const activeShapes = bcShapes.filter(s => !s.used);
  const anyFits = activeShapes.some(s => bcCanPlaceAnywhere(s.cells));
  if (!anyFits && activeShapes.length > 0) {
    bcOver = true;
    pauseTimer();
    if (bcScore > bcBest) { bcBest = bcScore; safeSet('bc-best', bcBest); safeSet('bc-stats', { best: bcBest }); }
    const msg = document.getElementById('bcMsg');
    if (msg) msg.textContent = `Game over \u2014 no piece fits. Final score: ${bcScore}.`;
    document.getElementById('bcBestDisplay').textContent = bcBest;
  }
}

/* ---------------- MAHJONG SOLITAIRE ---------------- */
// Standard 144-tile set: 3 suits x 9 x 4, 4 winds x 4, 3 dragons x 4, 4 flowers, 4 seasons.
// Flowers match any other flower, seasons any other season. Deals are built by playing the board
// backwards, so every new board can be cleared.
const MJ_SUIT_FACES = [];
for (let c = 0x1F007; c <= 0x1F021; c++) MJ_SUIT_FACES.push(String.fromCodePoint(c));
const MJ_HONOR_FACES = [0x1F000, 0x1F001, 0x1F002, 0x1F003, 0x1F004, 0x1F005, 0x1F006].map(c => String.fromCodePoint(c));
const MJ_FLOWERS = [0x1F022, 0x1F023, 0x1F024, 0x1F025].map(c => String.fromCodePoint(c));
const MJ_SEASONS = [0x1F026, 0x1F027, 0x1F028, 0x1F029].map(c => String.fromCodePoint(c));
let mjTiles, mjSelected, mjMatchesFound, mjTotalPairs, mjOver, mjBest, mjHistory = [], mjHint = null, mjStuck = false, mjShuffles = 0;
let mjLayoutId = (function () { const v = safeGet('mj-layout', 'turtle'); return (v === 'pyramid' || v === 'easy') ? v : 'turtle'; })();

function mjGrid(layer, xs, ys) { const out = []; ys.forEach(y => xs.forEach(x => out.push({ layer, x, y }))); return out; }
function mjRange(a, b, step) { const r = []; for (let v = a; v <= b; v += step) r.push(v); return r; }
function mjLayoutTurtle() {
  const p = [];
  p.push(...mjGrid(0, mjRange(2, 24, 2), [0]));
  p.push(...mjGrid(0, mjRange(6, 20, 2), [2]));
  p.push(...mjGrid(0, mjRange(4, 22, 2), [4]));
  p.push(...mjGrid(0, mjRange(2, 24, 2), [6, 8]));
  p.push(...mjGrid(0, mjRange(4, 22, 2), [10]));
  p.push(...mjGrid(0, mjRange(6, 20, 2), [12]));
  p.push(...mjGrid(0, mjRange(2, 24, 2), [14]));
  p.push({ layer: 0, x: 0, y: 7 }, { layer: 0, x: 26, y: 7 }, { layer: 0, x: 28, y: 7 });
  p.push(...mjGrid(1, mjRange(8, 18, 2), mjRange(2, 12, 2)));
  p.push(...mjGrid(2, mjRange(10, 16, 2), mjRange(4, 10, 2)));
  p.push(...mjGrid(3, [12, 14], [6, 8]));
  p.push({ layer: 4, x: 13, y: 7 });
  return p;
}
function mjLayoutPyramid() {
  return [].concat(mjGrid(0, mjRange(2, 16, 2), mjRange(0, 10, 2)), mjGrid(1, mjRange(4, 14, 2), mjRange(2, 8, 2)), mjGrid(2, mjRange(6, 12, 2), [4, 6]));
}
function mjLayoutEasy() {
  const p = mjGrid(0, mjRange(0, 14, 2), mjRange(0, 10, 2));
  p.push(...mjGrid(1, [3, 5, 7, 9], [3, 5, 7]));
  return p;
}
const MJ_LAYOUTS = {
  turtle:  { name: 'Turtle (144)', build: mjLayoutTurtle,  stats: 'mj-stats' },
  pyramid: { name: 'Pyramid (80)', build: mjLayoutPyramid, stats: 'mj-stats-pyramid' },
  easy:    { name: 'Easy (60)',    build: mjLayoutEasy,    stats: 'mj-stats-easy' }
};
function mjKey(face) { return MJ_FLOWERS.indexOf(face) >= 0 ? 'F' : MJ_SEASONS.indexOf(face) >= 0 ? 'S' : face; }
function mjShuf(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function mjOverlap(a, b) { return Math.abs(a.x - b.x) < 2 && Math.abs(a.y - b.y) < 2; }
function mjCoveredIn(t, list) { return list.some(o => !o.removed && o.layer > t.layer && mjOverlap(o, t)); }
function mjFreeIn(t, list) {
  if (t.removed || mjCoveredIn(t, list)) return false;
  const left = list.some(o => !o.removed && o.layer === t.layer && o.x === t.x - 2 && Math.abs(o.y - t.y) < 2);
  const right = list.some(o => !o.removed && o.layer === t.layer && o.x === t.x + 2 && Math.abs(o.y - t.y) < 2);
  return !left || !right;
}
function mjIsCovered(t) { return mjCoveredIn(t, mjTiles); }
function mjIsFree(t) { return mjFreeIn(t, mjTiles); }
// Play the given tiles backwards: repeatedly take two free tiles and give them the next pair. Returns false if stuck.
function mjAssign(tiles, pairs) {
  const rem = tiles.slice(), order = [];
  while (rem.length) {
    const free = rem.filter(t => mjFreeIn(t, rem));
    if (free.length < 2) return false;
    mjShuf(free);
    const a = free[0], b = free[1];
    order.push([a, b]);
    rem.splice(rem.indexOf(a), 1); rem.splice(rem.indexOf(b), 1);
  }
  order.forEach(([a, b], i) => { a.face = pairs[i][0]; b.face = pairs[i][1]; });
  return true;
}
function mjFreshPairs(n) {
  const pool = [];
  MJ_SUIT_FACES.concat(MJ_HONOR_FACES).forEach(f => { pool.push([f, f], [f, f]); });
  const fl = mjShuf(MJ_FLOWERS.slice()), se = mjShuf(MJ_SEASONS.slice());
  pool.push([fl[0], fl[1]], [fl[2], fl[3]], [se[0], se[1]], [se[2], se[3]]);
  return mjShuf(pool).slice(0, n);
}
function mjDeal(positions) {
  for (let attempt = 0; attempt < 80; attempt++) {
    const tiles = positions.map((p, i) => ({ layer: p.layer, x: p.x, y: p.y, face: '', removed: false, id: i }));
    if (mjAssign(tiles, mjFreshPairs(tiles.length / 2))) return tiles;
  }
  return positions.map((p, i) => ({ layer: p.layer, x: p.x, y: p.y, face: MJ_SUIT_FACES[Math.floor(i / 2) % 27], removed: false, id: i }));
}
function mjHasMoveAvailable() { return mjFindPair() !== null; }
function mjFindPair() {
  const free = mjTiles.filter(t => !t.removed && mjIsFree(t));
  for (let i = 0; i < free.length; i++) for (let j = i + 1; j < free.length; j++) if (mjKey(free[i].face) === mjKey(free[j].face)) return [free[i], free[j]];
  return null;
}
// Re-deal the tiles still on the board (same tiles, new arrangement) -- still solvable.
function mjShuffleRemaining() {
  const rem = mjTiles.filter(t => !t.removed);
  const byKey = {};
  rem.forEach(t => { (byKey[mjKey(t.face)] = byKey[mjKey(t.face)] || []).push(t.face); });
  const pairs = [];
  Object.keys(byKey).forEach(k => { const fs = mjShuf(byKey[k].slice()); for (let i = 0; i + 1 < fs.length; i += 2) pairs.push([fs[i], fs[i + 1]]); });
  mjShuf(pairs);
  for (let attempt = 0; attempt < 80; attempt++) if (mjAssign(rem, pairs)) return true;
  return false;
}

function renderMahjong(resume) {
  if (!resume) {
    mjTiles = mjDeal(MJ_LAYOUTS[mjLayoutId].build());
    mjSelected = null; mjMatchesFound = 0; mjTotalPairs = mjTiles.length / 2; mjOver = false;
    mjHistory = []; mjHint = null; mjStuck = false; mjShuffles = 0;

  view.innerHTML = `

      <ul>
        <li>A tile is <b>free</b> when nothing sits on top of it <i>and</i> it can slide out to the left or the right (at least one side open).</li>

        <li>Use <b>Hint</b> to see a matching pair, <b>Undo</b> to take back a move, and <b>Shuffle</b> to re-deal the tiles that are left when you are stuck.</li>
        <li>Pick a layout: <b>Turtle</b> is the classic five-layer board with all 144 tiles; Pyramid and Easy are smaller.</li>

    `)}
    ${coachBlock([

    <div class="diff-row" id="mjLayoutRow" style="flex-wrap:wrap;">${Object.keys(MJ_LAYOUTS).map(k => `<button type="button" class="diff-btn${k === mjLayoutId ? ' active' : ''}" data-layout="${k}">${MJ_LAYOUTS[k].name}</button>`).join('')}</div>
    <div class="mj-scroll"><div class="mj-board" id="mjBoard"></div></div>
    <div class="mj-side">
      <div class="bj-stats" style="margin:0;">
        <div><b id="mjPairsDisplay">${mjMatchesFound}</b>/${mjTotalPairs} Pairs</div>
        <div><b id="mjBestDisplay">${formatScoreClock(mjBest)}</b>Best time</div>
      </div>
      <div class="btn-row" style="margin-top:0;">
        <button class="btn ghost" id="mjHintBtn">Hint</button>
        <button class="btn ghost" id="mjUndoBtn">Undo</button>
        <button class="btn ghost" id="mjShuffleBtn">Shuffle</button>
        <button class="btn ghost" id="mjNew">New layout</button>
      </div>
      <div class="jig-solved-msg" id="mjMsg"></div>
    </div>
  `;
  document.getElementById('mjNew').addEventListener('click', () => renderMahjong());
  document.getElementById('mjHintBtn').addEventListener('click', mjShowHint);
  document.getElementById('mjUndoBtn').addEventListener('click', mjUndo);
  document.getElementById('mjShuffleBtn').addEventListener('click', mjDoShuffle);
  document.querySelectorAll('#mjLayoutRow [data-layout]').forEach(b => b.addEventListener('click', () => {
    mjLayoutId = b.dataset.layout; safeSet('mj-layout', mjLayoutId); renderMahjong();
  }));
  mjRenderBoard();
}

function mjRenderBoard() {
  const boardEl = document.getElementById('mjBoard');
  if (!boardEl) return;
  const maxX = Math.max.apply(null, mjTiles.map(t => t.x)) + 2, maxY = Math.max.apply(null, mjTiles.map(t => t.y)) + 2;
  const wrap = boardEl.parentNode, avail = (wrap && wrap.clientWidth) || 360;
  const ux = Math.max(9.5, Math.min(17, (avail - 8) / maxX)), uy = ux * 1.3;
  const tileW = ux * 2, tileH = uy * 2, off = Math.max(2, ux * 0.22);
  boardEl.style.width = Math.ceil(maxX * ux + 8 * off) + 'px';
  boardEl.style.height = Math.ceil(maxY * uy + 8 * off) + 'px';
  boardEl.innerHTML = '';
  const hintIds = mjHint ? mjHint.map(t => t.id) : [];
  mjTiles.slice().sort((a, b) => (a.layer - b.layer) || (a.y - b.y) || (a.x - b.x)).forEach(tile => {
    if (tile.removed) return;
    const el = document.createElement('div');
    el.className = 'mj-tile layer' + Math.min(tile.layer, 4);
    if (!mjIsFree(tile)) el.classList.add('dim');
    if (mjSelected === tile.id) el.classList.add('selected');
    if (hintIds.indexOf(tile.id) >= 0) el.classList.add('hint');
    el.style.left = (tile.x * ux + 4 * off - tile.layer * off) + 'px';
    el.style.top = (tile.y * uy + 4 * off - tile.layer * off) + 'px';
    el.style.width = tileW + 'px'; el.style.height = tileH + 'px';
    el.style.zIndex = String(tile.layer * 10 + 1);
    el.style.fontSize = (tileH * 0.8) + 'px';
    el.textContent = tile.face;
    el.addEventListener('click', () => mjHandleClick(tile.id));
    boardEl.appendChild(el);
  });
  const msg = document.getElementById('mjMsg');
  if (msg && mjStuck && !mjOver) msg.textContent = 'No matching pairs left — press Shuffle to re-deal the remaining tiles, or Undo.';
}

function mjSetMsg(t) { const m = document.getElementById('mjMsg'); if (m) m.textContent = t || ''; }
function mjShowHint() {
  if (mjOver) return;
  const p = mjFindPair();
  if (!p) { mjSetMsg('No matching pairs are free — try Shuffle or Undo.'); return; }
  mjHint = p; mjSelected = null; mjRenderBoard();
}
function mjUndo() {
  if (!mjHistory.length) { mjSetMsg('Nothing to undo.'); return; }
  const [a, b] = mjHistory.pop();
  a.removed = false; b.removed = false; mjMatchesFound--; mjSelected = null; mjHint = null; mjOver = false; mjStuck = false;
  const pd = document.getElementById('mjPairsDisplay'); if (pd) pd.textContent = mjMatchesFound;
  mjSetMsg(''); mjRenderBoard();
}
function mjDoShuffle() {
  if (mjOver) return;
  if (mjShuffleRemaining()) { mjShuffles++; mjHint = null; mjSelected = null; mjStuck = false; mjHistory = []; mjSetMsg('Shuffled the remaining tiles.'); mjRenderBoard(); mjCheckEnd(); }
}

function mjHandleClick(id) {
  if (mjOver) return;
  const tile = mjTiles.find(t => t.id === id);
  if (!tile || tile.removed || !mjIsFree(tile)) return;
  mjHint = null;
  if (mjSelected === null) { mjSelected = id; mjRenderBoard(); return; }
  if (mjSelected === id) { mjSelected = null; mjRenderBoard(); return; }
  const first = mjTiles.find(t => t.id === mjSelected);
  if (mjKey(first.face) === mjKey(tile.face)) {
    first.removed = true; tile.removed = true;
    mjHistory.push([first, tile]);
    mjMatchesFound++; mjSelected = null; mjSetMsg('');
    const pd = document.getElementById('mjPairsDisplay'); if (pd) pd.textContent = mjMatchesFound;
    mjRenderBoard(); mjCheckEnd();
  } else { mjSelected = id; mjRenderBoard(); }
}

function mjCheckEnd() {
  const msg = document.getElementById('mjMsg');
  if (mjMatchesFound === mjTotalPairs) {
    mjOver = true;
    pauseTimer();
    const elapsed = gameElapsedMs['mahjong'] || 0;
    const statsKey = MJ_LAYOUTS[mjLayoutId].stats;
    const { isNewBest } = recordPuzzleSolve(statsKey, elapsed);
    mjBest = safeGet(statsKey, { bestTimeMs: 0 }).bestTimeMs;
    if (statsKey === 'mj-stats') safeSet('mj-best-time', mjBest);
    const bestEl = document.getElementById('mjBestDisplay');
    if (bestEl) bestEl.textContent = formatScoreClock(mjBest);
    if (msg) msg.textContent = 'Board cleared — you win!' + (isNewBest ? ' New best time!' : '');
    return;
  }
  if (!mjHasMoveAvailable()) {
    mjStuck = true;
    if (msg) msg.textContent = 'No matching pairs left — press Shuffle to re-deal the remaining tiles, or Undo.';
  } else { mjStuck = false; }
}

/* ---------------- UNO ---------------- */
const UN_COLORS = ['red', 'yellow', 'green', 'blue'];
let unShowSetup = true, unPlayerCount, unNames, unDeck, unDiscard, unHands, unTurnIdx, unDir, unCurrentColor, unOver, unRoundWinner, unScores, unPendingWildIdx, unMsg;

function unBuildDeck() {
  const deck = [];
  UN_COLORS.forEach(color => {
    deck.push({color, value: '0'});
    for (let n = 1; n <= 9; n++) { deck.push({color, value: String(n)}); deck.push({color, value: String(n)}); }
    ['Skip', 'Reverse', 'Draw2'].forEach(v => { deck.push({color, value: v}); deck.push({color, value: v}); });
  });
  for (let i = 0; i < 4; i++) { deck.push({color: null, value: 'Wild'}); deck.push({color: null, value: 'Wild4'}); }
  return deck;
}

function unShuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}

function unCardLabel(card) {
  if (card.value === 'Wild') return 'Wild';
  if (card.value === 'Wild4') return 'Wild\n+4';
  if (card.value === 'Skip') return '⊘';
  if (card.value === 'Reverse') return '⇄';
  if (card.value === 'Draw2') return '+2';
  return card.value;
}

function unCardPoints(c) {
  if (c.value === 'Wild' || c.value === 'Wild4') return 50;
  if (c.value === 'Skip' || c.value === 'Reverse' || c.value === 'Draw2') return 20;
  return parseInt(c.value, 10);
}

function unCardPlayable(card, topColor, topValue) {
  if (card.value === 'Wild' || card.value === 'Wild4') return true;
  if (card.color === topColor) return true;
  if (card.value === topValue) return true;
  return false;
}

function unPlayableIndices(hand) {
  const topValue = unDiscard[unDiscard.length - 1].value;
  const out = [];
  hand.forEach((c, i) => { if (unCardPlayable(c, unCurrentColor, topValue)) out.push(i); });
  return out;
}

function unReshuffleIfNeeded() {
  if (unDeck.length) return;
  const top = unDiscard.pop();
  unDeck = unShuffle(unDiscard);
  unDeck.forEach(c => { if (c.value === 'Wild' || c.value === 'Wild4') c.color = null; });
  unDiscard = [top];
}

function unDrawCards(playerIdx, n) {
  for (let i = 0; i < n; i++) {
    unReshuffleIfNeeded();
    if (!unDeck.length) break;
    unHands[playerIdx].push(unDeck.pop());
  }
}

function unAdvanceTurn(steps) {
  unTurnIdx = (unTurnIdx + unDir * steps + unPlayerCount * 10) % unPlayerCount;
}

function unApplyAndAdvance(card) {
  if (card.value === 'Skip') { unAdvanceTurn(2); return; }
  if (card.value === 'Reverse') {
    if (unPlayerCount === 2) { unAdvanceTurn(2); return; }
    unDir *= -1; unAdvanceTurn(1); return;
  }
  if (card.value === 'Draw2') {
    const target = (unTurnIdx + unDir + unPlayerCount * 10) % unPlayerCount;
    unDrawCards(target, 2);
    unAdvanceTurn(2); return;
  }
  if (card.value === 'Wild4') {
    const target = (unTurnIdx + unDir + unPlayerCount * 10) % unPlayerCount;
    unDrawCards(target, 4);
    unAdvanceTurn(2); return;
  }
  unAdvanceTurn(1);
}

function unDealNewRound() {
  unDeck = unShuffle(unBuildDeck());
  unHands = [];
  for (let p = 0; p < unPlayerCount; p++) unHands.push(unDeck.splice(unDeck.length - 7, 7));
  let top;
  do { top = unDeck.pop(); if (top.value === 'Wild4') unDeck.unshift(top); } while (top.value === 'Wild4');
  unDiscard = [top];
  unCurrentColor = top.color;
  unTurnIdx = Math.floor(Math.random() * unPlayerCount);
  unDir = 1;
  unOver = false;
  unRoundWinner = null;
  unPendingWildIdx = null;
  unMsg = `${unNames[unTurnIdx]} goes first.`;
}

function unFinishRound(winnerIdx) {
  let pts = 0;
  unHands.forEach((hand, i) => { if (i !== winnerIdx) hand.forEach(c => { pts += unCardPoints(c); }); });
  unScores[winnerIdx] = (unScores[winnerIdx] || 0) + pts;
  unOver = true;
  unRoundWinner = winnerIdx;
  unMsg = `${unNames[winnerIdx]} wins the round! +${pts} points.`;
  const stats = safeGet('un-stats', { wins: 0, losses: 0 });
  if (winnerIdx === 0) stats.wins = (stats.wins || 0) + 1;
  else stats.losses = (stats.losses || 0) + 1;
  safeSet('un-stats', stats);
  // Round placings: the winner, then everyone else by the points left in their hand.
  const left = unHands.map((hand, i) => ({ i, cards: hand.length, pts: hand.reduce((sum, c) => sum + unCardPoints(c), 0) }));
  const placed = left.filter(x => x.i !== winnerIdx).sort((a, b) => a.pts - b.pts || a.cards - b.cards || a.i - b.i);
  const podiumEntries = [{ name: unNames[winnerIdx], you: winnerIdx === 0, detail: 'Played out · +' + pts + ' pts' }]
    .concat(placed.map(x => ({ name: unNames[x.i], you: x.i === 0, detail: x.cards + (x.cards === 1 ? ' card' : ' cards') + ' left (' + x.pts + ' pts)' })));
  setTimeout(() => showPodium({ game: 'Uno', entries: podiumEntries }), 900);
}

function unAfterTurn() {
  unRenderBoard();
  if (!unOver && unTurnIdx !== 0) setTimeout(unAiTurn, 700);
}

function unPlayCard(playerIdx, cardIdx, chosenColor) {
  const hand = unHands[playerIdx];
  const card = hand[cardIdx];
  hand.splice(cardIdx, 1);
  unDiscard.push(card);
  unCurrentColor = (card.value === 'Wild' || card.value === 'Wild4') ? chosenColor : card.color;
  if (hand.length === 0) { unFinishRound(playerIdx); unRenderBoard(); return; }
  unMsg = `${unNames[playerIdx]} played ${card.color || chosenColor} ${unCardLabel(card).replace('\n', ' ')}.`;
  unApplyAndAdvance(card);
  unAfterTurn();
}

function unAiTurn() {
  if (unOver) return;
  const idx = unTurnIdx;
  const hand = unHands[idx];
  const playable = unPlayableIndices(hand);
  if (playable.length) {
    const priority = c => (c.value === 'Draw2' || c.value === 'Skip' || c.value === 'Reverse') ? 0 : (c.value === 'Wild' ? 2 : c.value === 'Wild4' ? 3 : 1);
    playable.sort((a, b) => priority(hand[a]) - priority(hand[b]));
    const chosenIdx = playable[0];
    const card = hand[chosenIdx];
    let color = null;
    if (card.value === 'Wild' || card.value === 'Wild4') {
      const counts = {red: 0, yellow: 0, green: 0, blue: 0};
      hand.forEach(c => { if (c.color) counts[c.color]++; });
      color = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0] || 'red';
    }
    unPlayCard(idx, chosenIdx, color);
  } else {
    unDrawCards(idx, 1);
    unMsg = `${unNames[idx]} drew a card.`;
    unAdvanceTurn(1);
    unAfterTurn();
  }
}

function unStartSetup() { unShowSetup = true; renderUno(); }

function unRenderSetup() {
  view.innerHTML = `
    <h2 class="game-title">Uno</h2>
    <p class="game-sub">Pick how many computer opponents you want, then deal.</p>
    ${aboutBlock(`
      <ul>
        <li>Match the top card's color, number, or symbol — or play a Wild card any time.</li>
        <li>Skip, Reverse and Draw Two change the turn order the usual way; in a 2-player game, Reverse acts as a Skip.</li>
        <li>Wild lets you choose the next color; Wild Draw Four does the same and makes the next player draw four.</li>
        <li>No playable card? Draw one from the pile and your turn ends — the drawn card isn't played automatically.</li>
        <li>First to empty their hand wins the round and scores the value of every card left in everyone else's hands (number cards at face value, Skip/Reverse/Draw Two at 20, Wilds at 50).</li>
      </ul>
    `)}
    <div class="ch-tier-row" id="unAiRow"></div>
    <button class="btn" id="unStartBtn" style="margin-top:4px;">Deal</button>
  `;
  const row = document.getElementById('unAiRow');
  let chosen = 1;
  [1, 2, 3].forEach(n => {

    if (unTurnIdx !== 0) setTimeout(unAiTurn, 700);

}

function renderUno(resume) {
  if (unShowSetup) { unShowSetup = false; unRenderSetup(); return; }
  if (resume) {
    if (unHands) { unRenderBoard(); return; }
    unRenderSetup();
    return;
  }
  if (!unHands) { unRenderSetup(); return; }
  unHands = null;
  unRenderSetup();
}

function unRenderBoard() {
  view.innerHTML = `
